  <script type="text/plain" id="tpl-5s"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>5S Audit Command Center</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #232838;
    --field-bg: #171c28;
    --field-border: #2a3040;
    --text: #e8eaef;
    --muted: #8b93a7;
    --accent: #d99a3d;
    --accent-soft: rgba(217,154,61,0.12);
    --good: #3fae62;
    --good-soft: rgba(63,174,98,0.14);
    --avg: #d9b83d;
    --avg-soft: rgba(217,184,61,0.14);
    --bad: #d9553d;
    --bad-soft: rgba(217,85,61,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--panel-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
  }
  .brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .top-tabs {
    display: flex;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 4px;
  }
  .top-tabs span {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .top-tabs span.active {
    background: var(--accent);
    color: #1a1300;
  }

  .page {
    padding: 28px 32px 48px;
    max-width: 1500px;
    margin: 0 auto;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 {
    font-size: 32px;
    margin: 0 0 10px 0;
  }
  .lede {
    color: var(--muted);
    font-size: 14.5px;
    max-width: 760px;
    line-height: 1.55;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .badge-tag {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge-tag.log { background: rgba(139,147,167,0.15); color: var(--muted); }
  .panel-title {
    font-size: 17px;
    font-weight: 700;
  }
  .panel-sub {
    color: var(--muted);
    font-size: 12.5px;
    margin: 8px 0 20px 0;
    line-height: 1.5;
  }
  .req { color: var(--bad); }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field .hint {
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
    margin-left: 4px;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field.readonly input {
    color: var(--muted);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .pillar-block {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 14px 4px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.01);
  }
  .pillar-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #1a1300;
    border: none;
    border-radius: 9px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .submit-btn:hover { filter: brightness(1.08); }

  /* Right panel - logged cards */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0 18px 0;
  }
  .filter-pill {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--field-border);
    background: var(--field-bg);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-pill.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  select.filter-pill {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
  }
  select.filter-pill:focus {
    outline: none;
    border-color: var(--accent);
  }

  .cards-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 760px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .card {
    border: 1px solid var(--panel-border);
    background: var(--field-bg);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-id-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-id {
    font-family: "Courier New", monospace;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .status-chip {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 3px 9px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .status-good { background: var(--good-soft); color: var(--good); }
  .status-avg { background: var(--avg-soft); color: var(--avg); }
  .status-bad { background: var(--bad-soft); color: var(--bad); }
  .card-meta {
    color: var(--muted);
    font-size: 11.5px;
    white-space: nowrap;
  }
  .tag-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .section-label {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .criteria-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  .criteria-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 11px;
  }
  .criteria-item .k { color: var(--muted); display: block; margin-bottom: 2px; }
  .criteria-item .v { font-weight: 700; }
  .remarks-text {
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.5;
    margin-top: 2px;
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .final-score-pill {
    font-weight: 800;
    font-size: 13px;
  }
  .del-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
  }
  .del-link:hover { color: var(--bad); }
  .hide-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    margin-right: 14px;
  }
  .hide-link:hover { color: var(--accent); }
  .hidden-toggle {
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    margin-left: auto;
  }
  .hidden-toggle:hover { color: var(--accent); }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div id="roleGate" style="position:fixed;inset:0;z-index:9999;background:rgba(11,14,20,0.94);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:380px;width:100%;background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:32px 28px;text-align:center;">
    <div style="font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">5S Audit Command Center</div>
    <h2 style="margin:0 0 6px;color:var(--text);font-size:20px;">Continue as...</h2>
    <p style="margin:0 0 22px;color:var(--muted);font-size:13px;">Viewers can log new audits. Admins can also edit and delete them.</p>
    <div id="gateChoiceButtons" style="display:flex;flex-direction:column;gap:10px;">
      <button id="gateViewerBtn" type="button" class="submit-btn" style="background:var(--field-bg);border:1px solid var(--field-border);color:var(--text);">Continue as Viewer</button>
      <button id="gateAdminBtn" type="button" class="submit-btn">Continue as Admin</button>
    </div>
    <div id="gateLoginForm" style="display:none;flex-direction:column;gap:10px;margin-top:16px;text-align:left;">
      <div class="field">
        <label>Admin ID</label>
        <input type="text" id="gateAdminId" placeholder="Admin ID" autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="gateAdminPassword" placeholder="Password" autocomplete="off">
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="gateAdminSubmit" type="button" class="submit-btn" style="flex:1;">Sign in</button>
        <button id="gateBackBtn" type="button" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;">Back</button>
      </div>
      <span id="gateAdminError" style="color:var(--bad);font-size:13px;"></span>
    </div>
  </div>
</div>

<header>
  <div class="brand"><span class="dot"></span> 5S Audit Command Center</div>
  <div class="top-tabs">
    <span class="active">Audit Entries</span>
  </div>
</header>

<div class="page">
  <div class="eyebrow"><span class="dot"></span> 5S AUDIT LOG</div>
  <h1>5S Audit Entries</h1>
  <div class="lede">Audit numbers are assigned automatically in order (AUD-01, AUD-02, ...). Log a new audit on the left; every submission appears instantly as a card on the right. Scoring: 1 = Very Bad · 2 = Bad · 3 = Average · 4 = Good · 5 = Very Good. Sort, Set in Order, and Shine each use the average of their two questions; Standardize and Sustain are single scores out of 5. Total possible = 25 (5 pillars × 5). Final Score = (Total ÷ 25) × 100%.</div>

  <div class="grid">
    <!-- LEFT: FORM -->
    <div class="panel">
      <div class="panel-head">
        <span class="badge-tag">NEW</span>
        <span class="panel-title">Log an entry</span>
      </div>
      <div class="panel-sub">Fields marked <span class="req">*</span> are required.</div>

      <div class="row2">
        <div class="field readonly">
          <label>Audit No <span class="hint">auto-assigned</span></label>
          <input type="text" id="auditNo" readonly>
        </div>
        <div class="field">
          <label>Timestamp <span class="hint">auto</span></label>
          <input type="text" id="timestampDisplay" readonly>
        </div>
      </div>

      <div class="field">
        <label>SBU <span class="req">*</span></label>
        <select id="sbuSelect">
          <option value="">Select SBU...</option>
          <option value="ACCL">ACCL</option>
          <option value="APFIL">APFIL</option>
          <option value="FAL">FAL</option>
          <option value="MRML">MRML</option>
          <option value="M.OIL">M.OIL</option>
          <option value="AEFML">AEFML</option>
          <option value="AAFL">AAFL</option>
          <option value="ALEL">ALEL</option>
          <option value="AIL">AIL</option>
        </select>
      </div>

      <div class="field">
        <label>Audit Place <span class="req">*</span></label>
        <input type="text" id="auditPlace" placeholder="e.g. VRM 1 (Ground floor)">
      </div>

      <div class="row2">
        <div class="field">
          <label>Auditor Name <span class="req">*</span></label>
          <input type="text" id="auditorName" placeholder="Full name">
        </div>
        <div class="field">
          <label>Auditor Enroll <span class="req">*</span></label>
          <input type="text" id="auditorEnroll" placeholder="e.g. 562297">
        </div>
      </div>

      <div class="field">
        <label>Your Email <span class="req">*</span></label>
        <input type="email" id="submitterEmail" placeholder="e.g. name@company.com">
      </div>

      <div class="pillar-block">
        <div class="pillar-title">1. Sort (Seiri)</div>
        <div class="field">
          <label>Unnecessary items removed? <span class="req">*</span></label>
          <select id="s1">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
        <div class="field">
          <label>Red tags applied to unused items? <span class="req">*</span></label>
          <select id="s2">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
      </div>

      <div class="pillar-block">
        <div class="pillar-title">2. Set in Order (Seiton)</div>
        <div class="field">
          <label>Tools/materials assigned fixed locations? <span class="req">*</span></label>
          <select id="s3">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
        <div class="field">
          <label>Labels and markings visible & correct? <span class="req">*</span></label>
          <select id="s4">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
      </div>

      <div class="pillar-block">
        <div class="pillar-title">3. Shine (Seiso)</div>
        <div class="field">
          <label>Area clean and free of dust? <span class="req">*</span></label>
          <select id="s5">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
        <div class="field">
          <label>Cleaning responsibility assigned? <span class="req">*</span></label>
          <select id="s6">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
      </div>

      <div class="pillar-block">
        <div class="pillar-title">4. Standardize (Seiketsu)</div>
        <div class="field">
          <label>Documented standard followed consistently across shifts? <span class="req">*</span></label>
          <select id="s7">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
      </div>

      <div class="pillar-block">
        <div class="pillar-title">5. Sustain (Shitsuke)</div>
        <div class="field">
          <label>Practicing 5S without reminders? <span class="req">*</span></label>
          <select id="s8">
            <option value="">Select score...</option>
            <option value="1">1 = Very Bad</option>
            <option value="2">2 = Bad</option>
            <option value="3">3 = Average</option>
            <option value="4">4 = Good</option>
            <option value="5">5 = Very Good</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Remarks <span class="hint">if any note you want to share</span></label>
        <textarea id="remarks" placeholder="Optional notes..."></textarea>
      </div>

      <button class="submit-btn" id="submitBtn">Log Entry</button>
    </div>

    <!-- RIGHT: LOGGED CARDS -->
    <div class="panel">
      <div class="panel-head">
        <span class="badge-tag log">LOG</span>
        <span class="panel-title">Logged audits</span>
        <span class="card-meta" id="statusMsg" style="margin-left:auto;"></span>
      </div>
      <div class="panel-sub">Every logged audit appears below as a card with its auto-computed Final Score. Deleting an entry requires admin sign-in.</div>

      <div id="adminBar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--field-bg);">
        <span id="adminStatus" style="font-size:13px;color:var(--muted);">Signed out — viewing as everyone else</span>
        <span id="adminLoggedInBar" style="display:none;margin-left:auto;">
          <button id="adminLogoutBtn" class="hide-link" type="button">Log out admin</button>
        </span>
        <span id="adminLoginToggleWrap" style="margin-left:auto;">
          <button id="adminLoginToggleBtn" class="hide-link" type="button">Admin sign-in</button>
        </span>
      </div>
      <div id="adminLoginForm" style="display:none;gap:10px;margin:0 0 14px;padding:12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--field-bg);">
        <div class="row2">
          <div class="field">
            <label>Admin ID</label>
            <input type="text" id="adminIdInput" placeholder="Admin ID" autocomplete="off">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="off">
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <button id="adminLoginSubmitBtn" class="submit-btn" type="button" style="width:auto;padding:8px 18px;">Sign in</button>
          <span id="adminLoginError" style="font-size:13px;color:var(--bad);"></span>
        </div>
      </div>

      <div class="filters" id="filters">
        <div class="filter-pill active" data-filter="all">All</div>
        <div class="filter-pill" data-filter="good">Very Good / Good</div>
        <div class="filter-pill" data-filter="avg">Average</div>
        <div class="filter-pill" data-filter="bad">Bad / Very Bad</div>
        <select class="filter-pill" id="sbuFilter">
          <option value="all">All SBUs</option>
          <option value="ACCL">ACCL</option>
          <option value="APFIL">APFIL</option>
          <option value="FAL">FAL</option>
          <option value="MRML">MRML</option>
          <option value="M.OIL">M.OIL</option>
          <option value="AEFML">AEFML</option>
          <option value="AAFL">AAFL</option>
          <option value="ALEL">ALEL</option>
          <option value="AIL">AIL</option>
        </select>
        <span class="hidden-toggle" id="hiddenToggle">Show hidden (0)</span>
      </div>

      <div class="cards-list" id="cardsList"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1zZ68nxCL0XK0gPQDG5fsg_CqWCCBEU";
const TABLE = "accl_5s_audit_entries";

let entries = [];
let activeFilter = "all";
let activeSbuFilter = "all";
let showHidden = false;
const HIDDEN_KEY = "5s_audit_hidden_ids_v1";
let hiddenIds = new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]"));

function saveHiddenIds() {
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(Array.from(hiddenIds)));
}
let highestAuditNum = 0;

function apiHeaders(extra) {
  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}

// --- Admin auth --------------------------------------------------------
// Deleting audit entries is enforced at the database level (Row-Level
// Security): only a signed-in Supabase Auth session belonging to the
// admin account is allowed to DELETE from this table. The anon key alone
// (used for viewing + logging entries) cannot delete anything anymore.
const ADMIN_LOGIN_ID = "OPEX";
const ADMIN_AUTH_EMAIL = "opex@command-center.internal"; // internal auth identifier, not a real mailbox
const ADMIN_SESSION_KEY = "5s_admin_session_v1";

let adminSession = loadAdminSession();

function loadAdminSession() {
  try {
    const raw = localStorage.getItem(ADMIN_SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.access_token || !parsed.expires_at || parsed.expires_at <= Date.now()) {
      localStorage.removeItem(ADMIN_SESSION_KEY);
      return null;
    }
    return parsed;
  } catch (e) {
    return null;
  }
}

function isAdmin() {
  return !!(adminSession && adminSession.expires_at > Date.now());
}

async function adminLogin(loginId, password) {
  if ((loginId || "").trim().toUpperCase() !== ADMIN_LOGIN_ID) {
    throw new Error("Unknown admin ID.");
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: ADMIN_AUTH_EMAIL, password: password })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) {
    throw new Error(data.error_description || data.msg || "Sign-in failed.");
  }
  adminSession = {
    access_token: data.access_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000
  };
  localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(adminSession));
  return adminSession;
}

function adminLogout() {
  adminSession = null;
  localStorage.removeItem(ADMIN_SESSION_KEY);
}

function refreshAdminBar() {
  const status = document.getElementById("adminStatus");
  const loggedInBar = document.getElementById("adminLoggedInBar");
  const toggleWrap = document.getElementById("adminLoginToggleWrap");
  const loginForm = document.getElementById("adminLoginForm");
  if (isAdmin()) {
    status.textContent = "Signed in as admin — delete enabled";
    loggedInBar.style.display = "inline";
    toggleWrap.style.display = "none";
    loginForm.style.display = "none";
  } else {
    status.textContent = "Signed out — viewing as everyone else";
    loggedInBar.style.display = "none";
    toggleWrap.style.display = "inline";
  }
}

// --- Role gate (Continue as Viewer / Continue as Admin) ---------------
const ROLE_KEY = "5s_role_choice_v1";

function showGate() {
  document.getElementById("gateChoiceButtons").style.display = "flex";
  document.getElementById("gateLoginForm").style.display = "none";
  document.getElementById("gateAdminError").textContent = "";
  document.getElementById("gateAdminId").value = "";
  document.getElementById("gateAdminPassword").value = "";
  document.getElementById("roleGate").style.display = "flex";
}
function hideGate() {
  document.getElementById("roleGate").style.display = "none";
}
function decideGate() {
  if (isAdmin() || localStorage.getItem(ROLE_KEY) === "viewer") {
    hideGate();
  } else {
    showGate();
  }
}

// Map a Supabase row (snake_case columns) to the shape the UI uses internally.
function fromDbRow(row) {
  return {
    id: row.audit_no || ("AUD-" + row.id),
    dbId: row.id,
    timestamp: row.audit_timestamp ? new Date(row.audit_timestamp).toLocaleString("en-GB", {
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    }).replace(",", "") : "",
    place: row.audit_place,
    sbu: row.sbu,
    auditor: row.auditor_name,
    enroll: row.auditor_enroll,
    email: row.submitter_email,
    s1: row.sort_removed, s2: row.sort_redtag,
    s3: row.order_location, s4: row.order_labels,
    s5: row.shine_clean, s6: row.shine_assigned,
    s7: row.standardize, s8: row.sustain,
    remarks: row.remarks
  };
}

async function loadEntries() {
  const statusEl = document.getElementById("statusMsg");
  if (statusEl) statusEl.textContent = "Loading...";
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=audit_timestamp.asc`,
      { headers: apiHeaders() }
    );
    if (!res.ok) throw new Error("Fetch failed: " + res.status);
    const rows = await res.json();
    entries = rows.map(fromDbRow);
    highestAuditNum = entries.reduce((max, e) => {
      const m = /AUD-(\d+)/.exec(e.id || "");
      return m ? Math.max(max, parseInt(m[1], 10)) : max;
    }, 0);
    if (statusEl) statusEl.textContent = "";
  } catch (err) {
    console.error(err);
    if (statusEl) statusEl.textContent = "Could not load from Supabase";
    entries = [];
  }
}

async function insertEntry(entry) {
  const payload = {
    audit_no: entry.id,
    sbu: entry.sbu,
    audit_place: entry.place,
    auditor_name: entry.auditor,
    auditor_enroll: entry.enroll,
    sort_removed: Number(entry.s1),
    sort_redtag: Number(entry.s2),
    order_location: Number(entry.s3),
    order_labels: Number(entry.s4),
    shine_clean: Number(entry.s5),
    shine_assigned: Number(entry.s6),
    standardize: Number(entry.s7),
    sustain: Number(entry.s8),
    remarks: entry.remarks || null,
    submitter_email: entry.email
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method: "POST",
    headers: apiHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("Insert failed: " + res.status + " " + text);
  }
  return res.json();
}

async function deleteEntry(dbId) {
  if (!isAdmin()) throw new Error("Admin sign-in required to delete.");
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${dbId}`, {
    method: "DELETE",
    headers: apiHeaders({ "Authorization": "Bearer " + adminSession.access_token })
  });
  if (!res.ok) throw new Error("Delete failed: " + res.status);
}

function nextAuditNo() {
  return "AUD-" + String(highestAuditNum + 1).padStart(3, "0");
}

function nowTimestamp() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function pillarAvg(a, b) {
  const av = [a, b].map(Number).filter(v => !isNaN(v) && v !== "");
  if (av.length === 0) return null;
  return av.reduce((x,y)=>x+y,0) / av.length;
}

function computeTotals(e) {
  const sort = pillarAvg(e.s1, e.s2);
  const order = pillarAvg(e.s3, e.s4);
  const shine = pillarAvg(e.s5, e.s6);
  const standardize = e.s7 !== "" && e.s7 !== undefined && e.s7 !== null ? Number(e.s7) : null;
  const sustain = e.s8 !== "" && e.s8 !== undefined && e.s8 !== null ? Number(e.s8) : null;
  const pillars = [sort, order, shine, standardize, sustain];
  if (pillars.some(p => p === null)) return { total: null, percent: null };
  const total = Math.round((sort + order + shine + standardize + sustain) * 100) / 100;
  const percent = Math.round((total / 25) * 10000) / 100; // 2 decimal places
  return { total, percent };
}

function computeFinal(e) {
  return computeTotals(e).percent;
}

function scoreBand(final) {
  if (final === null) return "bad";
  if (final >= 80) return "good";
  if (final >= 60) return "avg";
  return "bad";
}

function scoreLabel(band) {
  if (band === "good") return "Good Standing";
  if (band === "avg") return "Needs Attention";
  return "Critical";
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function refreshFormDefaults() {
  document.getElementById("auditNo").value = nextAuditNo();
  document.getElementById("timestampDisplay").value = nowTimestamp();
}

function renderCards() {
  const list = document.getElementById("cardsList");
  const filtered = entries.filter(e => {
    if (showHidden) return hiddenIds.has(e.id);
    if (hiddenIds.has(e.id)) return false;
    if (activeSbuFilter !== "all" && (e.sbu || "") !== activeSbuFilter) return false;
    if (activeFilter === "all") return true;
    return scoreBand(computeFinal(e)) === activeFilter;
  });

  const hiddenToggle = document.getElementById("hiddenToggle");
  if (hiddenToggle) {
    hiddenToggle.textContent = showHidden
      ? "Back to dashboard"
      : `Show hidden (${hiddenIds.size})`;
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No entries in this view yet.</div>`;
    return;
  }

  list.innerHTML = filtered.slice().reverse().map(e => {
    const { total, percent } = computeTotals(e);
    const band = scoreBand(percent);
    const criteriaLabels = [
      ["Sort - Removed", e.s1], ["Sort - Red tag", e.s2],
      ["Order - Location", e.s3], ["Order - Labels", e.s4],
      ["Shine - Clean", e.s5], ["Shine - Assigned", e.s6],
      ["Standardize", e.s7], ["Sustain", e.s8]
    ];
    return `
      <div class="card">
        <div class="card-top">
          <div class="card-id-group">
            <span class="card-id">${escapeHtml(e.id)}</span>
            <span class="status-chip status-${band}">${scoreLabel(band)}</span>
          </div>
          <span class="card-meta">Logged ${escapeHtml(e.timestamp)}</span>
        </div>
        <div class="tag-row">
          <span class="tag">${escapeHtml(e.sbu || "—")}</span>
          <span class="tag">${escapeHtml(e.place || "—")}</span>
          <span class="tag">By ${escapeHtml(e.auditor || "—")}</span>
          <span class="tag">Enroll ${escapeHtml(e.enroll || "—")}</span>
          <span class="tag">${escapeHtml(e.email || "—")}</span>
        </div>
        <div class="section-label">Criteria Breakdown</div>
        <div class="criteria-grid">
          ${criteriaLabels.map(([k,v]) => `
            <div class="criteria-item">
              <span class="k">${k}</span>
              <span class="v">${v === undefined || v === "" || v === null ? "—" : v}</span>
            </div>`).join("")}
        </div>
        ${e.remarks ? `<div class="section-label">Remarks</div><div class="remarks-text">${escapeHtml(e.remarks)}</div>` : ""}
        <div class="card-footer">
          <span class="final-score-pill status-${band}">Final Score: ${percent === null ? "—" : percent + "%"} ${total === null ? "" : `(${total}/25)`}</span>
          <span>
            <button class="hide-link" data-id="${escapeHtml(e.id)}">${hiddenIds.has(e.id) ? "Unhide" : "Hide"}</button>
            ${isAdmin() ? `<button class="del-link" data-id="${escapeHtml(e.id)}">Delete</button>` : ""}
          </span>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".hide-link").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-id");
      if (hiddenIds.has(id)) {
        hiddenIds.delete(id);
      } else {
        hiddenIds.add(id);
      }
      saveHiddenIds();
      renderCards();
    });
  });

  list.querySelectorAll(".del-link").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-id");
      const target = entries.find(e => e.id === id);
      btn.disabled = true;
      btn.textContent = "Deleting...";
      try {
        if (target && target.dbId !== undefined) {
          await deleteEntry(target.dbId);
        }
        entries = entries.filter(e => e.id !== id);
        hiddenIds.delete(id);
        saveHiddenIds();
        renderCards();
      } catch (err) {
        console.error(err);
        alert("Could not delete this entry. Please try again.");
        btn.disabled = false;
        btn.textContent = "Delete";
      }
    });
  });
}

document.querySelectorAll(".filter-pill[data-filter]").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    activeFilter = pill.getAttribute("data-filter");
    renderCards();
  });
});

document.getElementById("sbuFilter").addEventListener("change", (e) => {
  activeSbuFilter = e.target.value;
  renderCards();
});

document.getElementById("hiddenToggle").addEventListener("click", () => {
  showHidden = !showHidden;
  renderCards();
});

document.getElementById("adminLoginToggleBtn").addEventListener("click", () => {
  const form = document.getElementById("adminLoginForm");
  form.style.display = form.style.display === "none" ? "flex" : "none";
  document.getElementById("adminLoginForm").style.flexDirection = "column";
});

document.getElementById("adminLogoutBtn").addEventListener("click", () => {
  adminLogout();
  localStorage.removeItem(ROLE_KEY);
  refreshAdminBar();
  renderCards();
  showGate();
});

document.getElementById("adminLoginSubmitBtn").addEventListener("click", async () => {
  const loginId = document.getElementById("adminIdInput").value;
  const password = document.getElementById("adminPasswordInput").value;
  const errEl = document.getElementById("adminLoginError");
  const btn = document.getElementById("adminLoginSubmitBtn");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    await adminLogin(loginId, password);
    document.getElementById("adminIdInput").value = "";
    document.getElementById("adminPasswordInput").value = "";
    refreshAdminBar();
    renderCards();
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

document.getElementById("gateViewerBtn").addEventListener("click", () => {
  localStorage.setItem(ROLE_KEY, "viewer");
  hideGate();
});

document.getElementById("gateAdminBtn").addEventListener("click", () => {
  document.getElementById("gateChoiceButtons").style.display = "none";
  document.getElementById("gateLoginForm").style.display = "flex";
});

document.getElementById("gateBackBtn").addEventListener("click", () => {
  document.getElementById("gateChoiceButtons").style.display = "flex";
  document.getElementById("gateLoginForm").style.display = "none";
});

document.getElementById("gateAdminSubmit").addEventListener("click", async () => {
  const loginId = document.getElementById("gateAdminId").value;
  const password = document.getElementById("gateAdminPassword").value;
  const errEl = document.getElementById("gateAdminError");
  const btn = document.getElementById("gateAdminSubmit");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    await adminLogin(loginId, password);
    localStorage.removeItem(ROLE_KEY);
    refreshAdminBar();
    renderCards();
    hideGate();
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

document.getElementById("submitBtn").addEventListener("click", async () => {
  const sbu = document.getElementById("sbuSelect").value;
  const place = document.getElementById("auditPlace").value.trim();
  const auditor = document.getElementById("auditorName").value.trim();
  const enroll = document.getElementById("auditorEnroll").value.trim();
  const email = document.getElementById("submitterEmail").value.trim();
  const scores = ["s1","s2","s3","s4","s5","s6","s7","s8"].map(id => document.getElementById(id).value);
  const remarks = document.getElementById("remarks").value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if (!sbu || !place || !auditor || !enroll || !emailOk || scores.some(v => v === "")) {
    alert("Please fill all required fields (marked *) with a valid email before logging the entry.");
    return;
  }

  const entry = {
    id: nextAuditNo(),
    sbu, place, auditor, enroll, email,
    s1: scores[0], s2: scores[1], s3: scores[2], s4: scores[3],
    s5: scores[4], s6: scores[5], s7: scores[6], s8: scores[7],
    remarks
  };

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Logging...";

  try {
    const inserted = await insertEntry(entry);
    const row = Array.isArray(inserted) ? inserted[0] : inserted;
    entries.push(fromDbRow(row));
    highestAuditNum += 1;

    // reset form
    document.getElementById("sbuSelect").value = "";
    document.getElementById("auditPlace").value = "";
    document.getElementById("auditorName").value = "";
    document.getElementById("auditorEnroll").value = "";
    document.getElementById("submitterEmail").value = "";
    ["s1","s2","s3","s4","s5","s6","s7","s8"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("remarks").value = "";
    refreshFormDefaults();
    renderCards();
  } catch (err) {
    console.error(err);
    alert("Could not save this entry to Supabase. Please check your connection and try again.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Log Entry";
  }
});

(async function init() {
  refreshAdminBar();
  decideGate();
  await loadEntries();
  refreshFormDefaults();
  renderCards();
})();
%%ENDSCRIPT%%>

  .nav-tabs{display:flex; gap:4px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:30px; padding:4px;}
  .nav-tab{

    background:transparent; border:none; border-radius:24px; padding:8px 16px; cursor:pointer; white-space:nowrap;
  }
  .nav-tab.active{background:var(--amber); color:#1A1408;}

  .view{display:none;}
  .view.active{display:block;}

  /* ===== HERO ===== */
  .hero{
    border-bottom:1px solid var(--line);
    background: radial-gradient(1200px 300px at 10% -10%, rgba(201,150,63,0.10), transparent), var(--bg);
    padding:36px 0 28px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;

  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px;}

  .stat-row{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}

  }
  .cat-stat-card .n{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; color:var(--amber);}
  .cat-stat-card .l{font-size:10.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.03em;}

  /* ===== FORMS / PANELS ===== */
  .grid{display:grid; grid-template-columns: 380px 1fr; gap:24px; margin-top:32px;}
  @media (max-width: 940px){ .grid{grid-template-columns:1fr;} }

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:24px;}
  .panel h2{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .panel h2 .idx{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:2px 6px;}
  .panel .desc{color:var(--muted); font-size:12.5px; margin-bottom:18px;}

  label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; margin-top:16px; font-weight:500;}
  label:first-of-type{margin-top:0;}
  label .req{color:var(--red); margin-left:2px;}
  label .opt{color:var(--muted-2); font-weight:400; margin-left:5px;}
  input, select, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:9px 11px; font-family:'Inter',sans-serif; font-size:13.5px;
    outline:none; transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--amber);}
  input:disabled{opacity:.65;}
  textarea{resize:vertical; min-height:64px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .save-input-wrap{position:relative;}
  .save-input-wrap input{padding-left:38px; font-family:'JetBrains Mono',monospace;}
  .save-prefix{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted-2); font-family:'JetBrains Mono',monospace; font-size:13px; pointer-events:none;}

  .btn{
    width:100%; margin-top:20px; background:var(--amber); color:#1A1408; border:none;
    border-radius:7px; padding:11px; font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.99);}
  .btn.secondary{background:transparent; border:1px solid var(--line); color:var(--muted); margin-top:8px;}
  .btn.secondary:hover{border-color:var(--muted-2); color:var(--text);}
  .btn.small{width:auto; margin-top:0; padding:9px 16px; font-size:13px;}
  .btn.green{background:var(--green); color:#0D1B14;}
  .btn.ghost-danger{background:transparent; border:1px solid #5A3530; color:var(--red);}
  .btn.ghost-danger:hover{background:rgba(201,107,90,.1);}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .btn.ghost:hover{border-color:var(--muted-2); color:var(--text);}
  .field-err{font-size:11.5px; color:var(--red); margin-top:5px; display:none;}

  .section-divider{
    margin:26px 0 16px; padding-top:16px; border-top:1px dashed var(--line);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted-2);
  }
  .section-divider:first-of-type{margin-top:20px;}

  /* ===== IC / PC LIST ===== */
  .tabs-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 10px; border-radius:20px;
    border:1px solid var(--line); color:var(--muted); cursor:pointer; background:transparent; white-space:nowrap;
  }
  .chip.active{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}

  .ic-list, .entry-list{display:flex; flex-direction:column; gap:12px; max-height:720px; overflow-y:auto; padding-right:4px;}
  .ic-list::-webkit-scrollbar, .entry-list::-webkit-scrollbar{width:6px;}
  .ic-list::-webkit-scrollbar-thumb, .entry-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .ic-card{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:16px 18px;}
  .ic-top{display:flex; justify-content:space-between; gap:14px; margin-bottom:8px; flex-wrap:wrap;}
  .ic-title-group{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .ic-cardno{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:var(--text);}
  .badge{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:20px;}
  .badge.pending{background:var(--amber-soft); color:var(--amber);}
  .badge.ongoing{background:var(--green-soft); color:var(--green);}
  .badge.rejected{background:rgba(201,107,90,.15); color:var(--red);}
  .badge.locked{background:var(--panel-3); color:var(--muted);}
  .ic-meta{font-size:11.5px; color:var(--muted-2); display:flex; gap:12px; flex-wrap:wrap;}
  .ic-body{font-size:13px; color:var(--text); line-height:1.5; margin:8px 0;}
  .ic-body .label{font-weight:700; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:3px;}
  .ic-body + .ic-body{margin-top:10px;}
  .ic-tags{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:2px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; color:var(--muted); background:var(--panel-3); border:1px solid var(--line); border-radius:5px; padding:3px 8px;}
  .tag.ic{background:var(--green-soft); color:var(--green); border:none;}
  .tag.pc{background:var(--blue-soft); color:var(--blue); border:none;}
  .tag.cat{background:var(--amber-soft); color:var(--amber); border:none;}

  .decision-row, .ongoing-row, .card-footer{
    display:flex; gap:10px; align-items:center; margin-top:14px; padding-top:14px;
    border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .ongoing-row{color:var(--green); font-size:12.5px;}
  .ongoing-row .pulse{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(95,174,132,.5); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,174,132,.45);} 70%{box-shadow:0 0 0 7px rgba(95,174,132,0);} 100%{box-shadow:0 0 0 0 rgba(95,174,132,0);}}
  .target-date{font-weight:700; color:var(--text);}
  .target-inline{display:flex; align-items:center; gap:8px; flex:1; min-width:220px;}
  .target-inline input{padding:9px 12px; font-size:13px;}

  /* ===== LEDGER ENTRIES ===== */
  .ledger-head{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .ledger-head-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .search{position:relative; flex:1; min-width:180px;}
  .search input{padding-left:32px;}
  .search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5;}

  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .dropdown-wrap{position:relative;}
  .dd-btn{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .dd-btn:hover{border-color:var(--muted-2);}
  .dd-btn.filtered{border-color:var(--amber); color:var(--amber);}
  .dd-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:30;
    background:var(--panel-3); border:1px solid var(--line); border-radius:8px; padding:6px;
    min-width:150px; max-height:260px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .dd-panel.open{display:block;}
  .dd-item{font-size:12.5px; padding:7px 10px; border-radius:6px; cursor:pointer; color:var(--text);}
  .dd-item:hover{background:var(--panel-2);}
  .dd-item.active{color:var(--amber); font-weight:700;}

  .entry{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:grid; grid-template-columns: 44px 1fr auto; gap:14px; align-items:start;}
  .entry .sl{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); background:var(--bg); border-radius:6px; text-align:center; padding:6px 0; height:fit-content;}
  .entry .body .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:5px;}
  .entry .card-no{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);}
  .entry .details{font-size:13px; line-height:1.45; color:var(--text); margin:2px 0 6px;}
  .entry .meta{font-size:11px; color:var(--muted-2); display:flex; gap:12px; flex-wrap:wrap;}
  .entry .amount{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--amber); text-align:right; white-space:nowrap;}
  .entry .del{background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:16px; margin-top:6px;}
  .entry .del:hover{color:var(--red);}
  .entry-actions{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}

  .empty{text-align:center; padding:50px 20px; color:var(--muted-2);}
  .empty svg{opacity:.35; margin-bottom:10px;}
  .empty p{font-size:13px; margin:0;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--amber); color:var(--text);
    padding:11px 20px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s; font-family:'JetBrains Mono',monospace; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  ::-webkit-scrollbar{width:8px;}
</style>
</head>

function loadAdminSession(){
  try{

    if(!raw) return null;

function nextCardNo(pool, prefix){
  let max = 0;
  // No trailing $ anchor — card numbers now look like "ICO-05 — VRM", so we
  // only need to match the "PREFIX-NN" lead-in to find the next sequence number.
  const re = new RegExp('^'+prefix+'-(\\d+)','i');
  pool.forEach(c => { const m = re.exec(c.cardno); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return prefix + '-' + String(max+1).padStart(2,'0');
}

  else if(raw === 'Rejected') status = 'rejected';
  else status = 'locked';                          // Completed / Initiated / any other historical status — read-only
  return {
    id: row.id, sbu: row.sbu, cardno: row.card_no, dept: row.dept,
    provider: row.provider, created: row.created_date, details: row.details,
    benefit: row.benefit,

    targetDate: row.target_date, acceptedDate: row.accepted_date, hidden: !!row.hidden
  };
}

  pcCards = pcCards.filter(c=>c.id!==id);
  showToast('Card deleted');
  refreshPcCardNoPreview();
  renderPc();
}
async function hidePcCard(id){
  try{
    await sbFetch(`${PC_TABLE}?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: JSON.stringify({ hidden: true }) });
  }catch(e){ console.error('hidePcCard failed', e); }
  const c = pcCards.find(c=>c.id===id); if(c) c.hidden = true;
  renderPc();
}
async function unhidePcCard(id){
  try{
    await sbFetch(`${PC_TABLE}?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: JSON.stringify({ hidden: false }) });
  }catch(e){ console.error('unhidePcCard failed', e); }
  const c = pcCards.find(c=>c.id===id); if(c) c.hidden = false;
  renderPc();
}

function renderPc(){
  const list = document.getElementById('pcList');
  let filtered;
  if(currentPcTab === 'hidden') filtered = pcCards.filter(c=>c.hidden);
  else if(currentPcTab === 'all') filtered = pcCards.filter(c=>!c.hidden);
  else filtered = pcCards.filter(c=>!c.hidden && c.status===currentPcTab);

  if(filtered.length===0){
    list.innerHTML = `<div class="empty"><p>${pcCards.length===0 ? 'No problem solving cards logged yet — use the form.' : 'Nothing in this view.'}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="ic-card">
      <div class="ic-top">
        <div class="ic-title-group">
          <span class="ic-cardno">${escapeHtml(c.cardno)}</span>
          <span class="badge ${c.status}">${c.status==='ongoing' ? 'Ongoing' : c.status==='rejected' ? 'Rejected' : c.status==='locked' ? escapeHtml(c.rawStatus) : 'Pending'}</span>
        </div>
        <div class="ic-meta"><span>${escapeHtml(c.sbu)}</span><span>Logged ${c.created}</span></div>
      </div>
      <div class="ic-tags">
        <span class="tag">${escapeHtml(c.dept)}</span>
        <span class="tag">By ${escapeHtml(c.provider)}</span>
      </div>
      <div class="ic-body"><span class="label">Problem Description</span>${escapeHtml(c.problem)}</div>
      ${c.rootCause ? `<div class="ic-body"><span class="label">Root Cause</span>${escapeHtml(c.rootCause)}</div>` : ''}
      ${c.corrective ? `<div class="ic-body"><span class="label">Corrective / Remedial Action</span>${escapeHtml(c.corrective)}</div>` : ''}

      ${c.status === 'ongoing' ? `
        <div class="ongoing-row"><span class="pulse"></span>Project ongoing — target completion <span class="target-date">${c.targetDate}</span></div>
      ` : c.status === 'rejected' || c.status === 'locked' ? '' : !isPcAdmin() ? '' : c._picking ? `
        <div class="decision-row">
          <div class="target-inline">
            <input type="date" id="target-pc-${c.id}" />
            <button class="btn small green" onclick="confirmAcceptPc(${c.id})">Confirm target</button>
          </div>
          <button class="btn small ghost" onclick="cancelPickPc(${c.id})">Cancel</button>
        </div>
      ` : `
        <div class="decision-row">
          <button class="btn small green" onclick="showTargetPickerPc(${c.id})">Accept</button>
          <button class="btn small ghost-danger" onclick="rejectPcCard(${c.id})">Reject</button>
        </div>
      `}

      <div class="card-footer">
        ${c.hidden
          ? `<button class="btn small ghost" onclick="unhidePcCard(${c.id})">Unhide</button>`
          : `<button class="btn small ghost" onclick="hidePcCard(${c.id})">Hide</button>`
        }
        ${isPcAdmin() ? `<button class="btn small ghost-danger" onclick="deletePcCard(${c.id})">Delete</button>` : ''}
      </div>
    </div>
  `).join('');
}

/* ============================================================
   SAVINGS FORM (merged) — one entry form, 5 amount sections
   ============================================================ */
function buildCatFieldsHTML(){
  return CATEGORIES.map(cat => {
    const amountInput = `<input id="sv-amount-${cat.key}" type="number" placeholder="0.00" step="0.01" />`;
    const amountWrapped = cat.prefix
      ? `<div class="save-input-wrap"><span class="save-prefix">${cat.prefix}</span>${amountInput}</div>`
      : amountInput;
    const unitField = cat.unitMode === 'select'
      ? `<select id="sv-uom-${cat.key}">${cat.unitOptions.map(o=>`<option>${escapeHtml(o)}</option>`).join('')}</select>`
      : `<input id="sv-uom-${cat.key}" placeholder="Unit" value="${escapeHtml(cat.unitDefault)}" />`;
    return `
      <div class="section-divider">${escapeHtml(cat.chipLabel)}</div>
      <label>${escapeHtml(cat.amountLabel)}</label>
      <div class="row2">${amountWrapped}${unitField}</div>
    `;
  }).join('');
}

function buildCategoryChips(){
  const row = document.getElementById('sv-categoryChipRow');
  const all = `<button class="chip active" data-f="all" onclick="setCategoryFilter('all')">All categories</button>`;
  const rest = CATEGORIES.map(cat =>
    `<button class="chip" data-f="${cat.key}" onclick="setCategoryFilter('${cat.key}')">${escapeHtml(cat.chipLabel)}</button>`
  ).join('');
  row.innerHTML = all + rest;
}

function buildCatStats(){
  const row = document.getElementById('sv-catStats');
  row.innerHTML = CATEGORIES.map(cat => {
    const catEntries = ledgerState.entries.filter(e => e.category === cat.key);
    const total = catEntries.reduce((s,e)=>s+e.amount, 0);
    const uoms = new Set(catEntries.map(e=>e.uom).filter(Boolean));
    const unitLabel = uoms.size === 0 ? (cat.unitDefault || '') : (uoms.size === 1 ? [...uoms][0] : 'mixed units');
    const prefix = cat.prefix || '';
    return `
      <div class="cat-stat-card">
        <div class="n">${prefix}${fmtMoney(total)}</div>
        <div class="l">${escapeHtml(cat.chipLabel)} ${unitLabel ? '· '+escapeHtml(unitLabel) : ''}</div>
      </div>`;
  }).join('');
}

function rowToEntry(row, categoryKey){
  const monthly = row.monthly_values || {};
  const amount = Object.values(monthly).reduce((s,v)=>s + (parseFloat(v)||0), 0);
  return {
    sl: row.sl ?? row.id,
    dbId: row.id,
    category: categoryKey,
    source: row.source,
    cardno: row.card_no,
    section: row.section,
    benefit: row.project_details,
    created: row.start_date,
    complete: row.completed_date,
    ongoing: '',
    amount,
    uom: row.uom,
    logged: row.created_at
  };
}

async function loadEntries(){
  try{
    const results = await Promise.all(
      Object.entries(TABLE_MAP).map(([catKey, table]) =>
        sbFetch(`${table}?select=*&hidden=eq.false&order=id.desc`).then(rows => (rows||[]).map(r => rowToEntry(r, catKey)))
      )
    );
    ledgerState.entries = results.flat().sort((a,b) => new Date(b.logged||0) - new Date(a.logged||0));
    ledgerState.nextSL = ledgerState.entries.reduce((m,e)=>Math.max(m,e.sl||0),0)+1;
  }catch(e){
    console.error('loadEntries failed', e);
    ledgerState.entries = [];
  }
}

function poolForSource(source){ return source === 'IC' ? icCards : pcCards; }

function onSourceChange(key){
  refreshCardNoOptions(key);
  onCardNoSelect(key);
}

function refreshCardNoOptions(key){
  const source = document.getElementById(key+'-source').value;
  const sel = document.getElementById(key+'-cardno-select');
  const pool = poolForSource(source);
  const ongoing = pool.filter(c => c.status === 'ongoing');
  const label = source === 'IC' ? 'improvement' : 'problem solving';
  if(ongoing.length === 0){
    sel.innerHTML = `<option value="">No ongoing ${label} cards yet</option>`;
    return;
  }
  sel.innerHTML = ongoing.map(c =>
    `<option value="${c.id}">${escapeHtml(c.cardno)} — ${escapeHtml(c.dept)}</option>`
  ).join('');
}

function onCardNoSelect(key){
  const source = document.getElementById(key+'-source').value;
  const pool = poolForSource(source);
  const sel = document.getElementById(key+'-cardno-select');
  const id = parseInt(sel.value);
  const c = pool.find(c => c.id === id);
  const secEl = document.getElementById(key+'-section');
  const benEl = document.getElementById(key+'-benefit');
  const creEl = document.getElementById(key+'-created');
  const ongEl = document.getElementById(key+'-ongoing');

  if(!c){
    secEl.value = '';
    secEl.placeholder = 'Select a card above';
    secEl.disabled = false; benEl.disabled = false; creEl.disabled = false; ongEl.disabled = false;
    return;
  }
  // Department comes straight from Supabase (the card's own dept field) — always
  // reflects the real value, whatever it is, instead of only matching a fixed list.
  secEl.value = c.dept || '';
  benEl.value = c.benefit || '';
  creEl.value = c.created;
  ongEl.value = c.acceptedDate || '';
  secEl.disabled = true; benEl.disabled = true; creEl.disabled = true; ongEl.disabled = true;
}

function clearLedgerForm(){
  document.getElementById('sv-benefit').value='';
  document.getElementById('sv-created').value='';
  document.getElementById('sv-ongoing').value='';
  document.getElementById('sv-complete').value='';
  CATEGORIES.forEach(cat=>{
    document.getElementById('sv-amount-'+cat.key).value='';
    if(cat.unitMode === 'text') document.getElementById('sv-uom-'+cat.key).value = cat.unitDefault;
  });
  document.getElementById('sv-source').value='IC';
  document.getElementById('sv-section').value='';
  document.getElementById('sv-section').placeholder='Select a card above';
  document.getElementById('sv-section').disabled=false;
  document.getElementById('sv-benefit').disabled=false;
  document.getElementById('sv-created').disabled=false;
  document.getElementById('sv-ongoing').disabled=false;
  document.getElementById('sv-err').style.display='none';
  onSourceChange('sv');
}

async function addEntry(){
  const source = document.getElementById('sv-source').value;
  const sel = document.getElementById('sv-cardno-select');
  const opt = sel.options[sel.selectedIndex];
  const cardno = opt ? opt.textContent.split(' — ')[0] : '';
  const err = document.getElementById('sv-err');

  if(!cardno){ err.style.display='block'; return; }

  const section = document.getElementById('sv-section').value;
  const benefit = document.getElementById('sv-benefit').value.trim();
  const created = document.getElementById('sv-created').value || null;
  const complete = document.getElementById('sv-complete').value || null;
  const monthKey = monthKeyFromDate(created);

  const inserts = [];
  CATEGORIES.forEach(cat=>{
    const raw = document.getElementById('sv-amount-'+cat.key).value;
    if(raw === '' || raw === null) return;
    const amount = parseFloat(raw);
    if(isNaN(amount)) return;
    const uom = document.getElementById('sv-uom-'+cat.key).value.trim();
    inserts.push({
      table: TABLE_MAP[cat.key],
      body: {
        sl: ledgerState.nextSL++,
        source, card_no: cardno,
        project_details: benefit,
        section,
        uom,
        start_date: created,
        completed_date: complete,
        monthly_values: { [monthKey]: amount }
      }
    });
  });

  if(inserts.length === 0){ err.style.display='block'; return; }
  err.style.display='none';

  try{
    await Promise.all(inserts.map(({table, body}) =>
      sbFetch(table, { method: 'POST', body: JSON.stringify(body) })
    ));
  }catch(e){
    console.error('addEntry failed', e);
    showToast('Failed to save — check connection');
    return;
  }

  await loadEntries();
  clearLedgerForm();
  showToast(inserts.length === 1 ? '1 entry added to ledger' : `${inserts.length} entries added to ledger`);
  render();
}

async function deleteEntry(sl){
  if(!isSvAdmin()){
    showToast('Admin sign-in required to remove');
    return;
  }
  const entry = ledgerState.entries.find(e => e.sl === sl);
  if(!entry) return;
  const table = TABLE_MAP[entry.category];
  try{
    await sbFetch(`${table}?id=eq.${entry.dbId}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: JSON.stringify({ hidden: true }),
      headers: { 'Authorization': `Bearer ${adminSession.access_token}` }
    });
  }catch(e){
    console.error('deleteEntry failed', e);
    showToast('Failed to remove — check connection');
    return;
  }
  ledgerState.entries = ledgerState.entries.filter(e => e.sl !== sl);
  showToast('Entry removed from dashboard');
  render();
}

function setSourceFilter(f){
  ledgerState.sourceFilter = f;
  document.querySelectorAll('#sv-sourceChipRow .chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  render();
}
function setCategoryFilter(f){
  ledgerState.categoryFilter = f;
  document.querySelectorAll('#sv-categoryChipRow .chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  render();
}

function toggleDropdown(which){
  const panel = document.getElementById('sv-'+which+'Panel');
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.dd-panel').forEach(p=>p.classList.remove('open'));
  if(!isOpen) panel.classList.add('open');
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.dropdown-wrap')){
    document.querySelectorAll('.dd-panel').forEach(p=>p.classList.remove('open'));
  }
});

function buildMonthPanel(){
  const panel = document.getElementById('sv-monthPanel');
  const items = [`<div class="dd-item ${ledgerState.month==='all'?'active':''}" onclick="setMonthFilter('all')">All months</div>`]
    .concat(MONTHS.map((m,i)=>`<div class="dd-item ${ledgerState.month===i?'active':''}" onclick="setMonthFilter(${i})">${m}</div>`));
  panel.innerHTML = items.join('');
}
function setMonthFilter(v){
  ledgerState.month = v;
  const btn = document.getElementById('sv-monthBtn');
  btn.textContent = (v==='all' ? 'Month: All ▾' : MONTHS[v]+' ▾');
  btn.classList.toggle('filtered', v!=='all');
  document.querySelectorAll('.dd-panel').forEach(p=>p.classList.remove('open'));
  render();
}

function entryDateForFilter(e){ return e.created || (e.logged ? e.logged.slice(0,10) : null); }

function buildYearPanel(){
  const years = new Set();
  ledgerState.entries.forEach(e=>{ const d = entryDateForFilter(e); if(d) years.add(parseInt(d.slice(0,4))); });
  const sorted = [...years].sort((a,b)=>b-a);
  const list = sorted.length ? sorted : [new Date().getFullYear()];
  const panel = document.getElementById('sv-yearPanel');
  const items = [`<div class="dd-item ${ledgerState.year==='all'?'active':''}" onclick="setYearFilter('all')">All years</div>`]
    .concat(list.map(y=>`<div class="dd-item ${ledgerState.year===y?'active':''}" onclick="setYearFilter(${y})">${y}</div>`));
  panel.innerHTML = items.join('');
}
function setYearFilter(v){
  ledgerState.year = v;
  const btn = document.getElementById('sv-yearBtn');
  btn.textContent = (v==='all' ? 'Year: All ▾' : v+' ▾');
  btn.classList.toggle('filtered', v!=='all');
  document.querySelectorAll('.dd-panel').forEach(p=>p.classList.remove('open'));
  render();
}

function catLabel(key){
  const c = CATEGORIES.find(c=>c.key===key);
  return c ? c.chipLabel : key;
}

function render(){
  buildCatStats();
  buildMonthPanel();
  buildYearPanel();

  const q = document.getElementById('sv-searchBox').value.toLowerCase();
  let filtered = ledgerState.entries.filter(e=>{
    const matchesSource = ledgerState.sourceFilter==='all' || e.source===ledgerState.sourceFilter;
    const matchesCategory = ledgerState.categoryFilter==='all' || e.category===ledgerState.categoryFilter;
    const matchesSearch = !q || e.cardno.toLowerCase().includes(q) || (e.benefit||'').toLowerCase().includes(q) || (e.section||'').toLowerCase().includes(q);
    const d = entryDateForFilter(e);
    const matchesMonth = ledgerState.month==='all' || (d && parseInt(d.slice(5,7))-1 === ledgerState.month);
    const matchesYear = ledgerState.year==='all' || (d && parseInt(d.slice(0,4)) === ledgerState.year);
    return matchesSource && matchesCategory && matchesSearch && matchesMonth && matchesYear;
  });

  const list = document.getElementById('sv-entryList');
  if(filtered.length===0){
    list.innerHTML = `<div class="empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5C6774" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <p>${ledgerState.entries.length===0 ? 'No entries yet — log the first one on the left.' : 'Nothing matches these filters.'}</p>
    </div>`;
  } else {
    list.innerHTML = filtered.map(e => `
      <div class="entry">
        <div class="sl">${String(e.sl).padStart(2,'0')}</div>
        <div class="body">
          <div class="top">
            <span class="tag ${e.source.toLowerCase()}">${e.source}</span>
            <span class="tag cat">${escapeHtml(catLabel(e.category))}</span>
            <span class="tag">${escapeHtml(e.section||'')}</span>
            <span class="card-no">${escapeHtml(e.cardno)}</span>
          </div>
          ${e.benefit ? `<div class="details">${escapeHtml(e.benefit)}</div>` : ''}
          <div class="meta">
            ${e.created ? `<span>Created ${e.created}</span>` : ''}
            ${e.ongoing ? `<span>Ongoing ${e.ongoing}</span>` : ''}
            ${e.complete ? `<span>Complete ${e.complete}</span>` : ''}
          </div>
        </div>
        <div class="entry-actions">
          <div class="amount">${fmtMoney(e.amount)}${e.uom ? ' '+escapeHtml(e.uom) : ''}</div>
          ${isSvAdmin() ? `<button class="del" onclick="deleteEntry(${e.sl})" title="Remove">✕</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('sv-statCount').textContent = ledgerState.entries.length;
  document.getElementById('sv-statIC').textContent = ledgerState.entries.filter(e=>e.source==='IC').length;
  document.getElementById('sv-statPC').textContent = ledgerState.entries.filter(e=>e.source==='PC').length;

  const bySection = {};
  ledgerState.entries.forEach(e => bySection[e.section] = (bySection[e.section]||0) + 1);
  const top = Object.entries(bySection).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sv-statSection').textContent = top ? top[0] : '—';
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  buildNav();
  document.getElementById('sv-catFields').innerHTML = buildCatFieldsHTML();
  buildCategoryChips();
  refreshAdminBar();
  decideGate();
  await loadIcCards();
  await loadPcCards();
  await loadEntries();
  onSourceChange('sv');
  render();
})();
%%ENDSCRIPT%%>
