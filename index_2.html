</script>
<script type="text/plain" id="tpl-project"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Control Sheet</title>

<style>
  :root{
    --bg:#0b0e14;
    --panel:#12161f;
    --panel-border:#232838;
    --field-bg:#171c28;
    --field-border:#2a3040;
    --text:#e8eaef;
    --muted:#8b93a7;
    --accent:#d99a3d;
    --accent-soft:rgba(217,154,61,0.12);
    --good:#3fae62;
    --good-soft:rgba(63,174,98,0.14);
    --avg:#d9b83d;
    --avg-soft:rgba(217,184,61,0.14);
    --bad:#d9553d;
    --bad-soft:rgba(217,85,61,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    padding:0 0 60px;
    min-height:100vh;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 32px;}

  /* ---------- Header / nameplate ---------- */
  .nameplate{
    border:none;
    background:transparent;
    padding:22px 0 18px;
    margin-bottom:8px;
    position:relative;
    border-bottom:1px solid var(--panel-border);
  }
  .nameplate::before, .nameplate::after,
  .nameplate .corner-b::before, .nameplate .corner-b::after{ content:none; }
  .eyebrow{
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  h1{
    font-family:inherit;
    font-weight:800;
    text-transform:none;
    letter-spacing:0;
    font-size:32px;
    margin:8px 0 6px;
    background:none;
    -webkit-background-clip:unset;
    background-clip:unset;
    color:var(--text);
  }
  .title-rule{ display:none; }

  /* ---------- Section shells ---------- */
  .section{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    margin-bottom:22px;
  }
  .section-head{
    display:flex;align-items:center;gap:10px;
    padding:16px 20px;
    border-bottom:1px solid var(--panel-border);
    background:transparent;
  }
  .section-id{
    font-family:"Courier New",monospace;
    font-weight:800;
    color:var(--accent);
    font-size:10.5px;
    letter-spacing:.6px;
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:5px;
  }
  .section-title{
    font-family:inherit;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    font-size:16px;
    color:var(--text);
  }
  .section-body{padding:20px 20px 22px;}

  /* ---------- Form ---------- */
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 18px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    text-transform:none;
    letter-spacing:0;
  }
  input[type=text], input[type=date], input[type=number], select, textarea{
    font-family:inherit;
    font-size:13.5px;
    padding:11px 12px;
    border:1px solid var(--field-border);
    background:var(--field-bg);
    color:var(--text);
    border-radius:8px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:none;
    border-color:var(--accent);
  }
  textarea{resize:vertical;min-height:60px;font-family:inherit;}
  ::placeholder{ color:var(--muted); opacity:1; }

  .btn{
    font-family:inherit;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    font-size:14px;
    padding:12px 22px;
    border:none;
    background:var(--accent);
    color:#1a1300;
    cursor:pointer;
    border-radius:9px;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1300;}
  .btn.confirm{background:var(--good);border-color:var(--good);color:#05230f;}
  .btn.small{padding:8px 14px;font-size:12.5px;}
  .btn-row{margin-top:18px;display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap;}
  .hint{font-size:12.5px;color:var(--muted);margin-right:auto;}

  /* ---------- Completed-project actuals block ---------- */
  .actuals-block{
    margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--panel-border);
  }
  .actuals-title{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;color:var(--good);
    text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:10px;
  }
  .actuals-title::before{
    content:"✓";
    width:16px;height:16px;border-radius:50%;
    background:var(--good-soft);color:var(--good);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10.5px;
  }

  /* ---------- Setup dropdown row ---------- */
  .setup-selects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 18px;
    margin-bottom:20px;
  }

  /* ---------- Milestone table ---------- */
  .ms-head, .ms-row{
    display:grid;
    grid-template-columns:1fr 120px 88px 32px;
    gap:10px;
    align-items:center;
  }
  .ms-head{
    font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;
    padding:0 2px 8px;
    border-bottom:1px solid var(--panel-border);
    margin-bottom:8px;
  }
  .ms-row{padding:6px 2px;}
  .ms-row + .ms-row{border-top:1px dashed var(--panel-border);}
  .ms-row input[type=number]{
    font-family:"Courier New",monospace;
    text-align:right;
  }
  .toggle{
    font-family:"Courier New",monospace;
    font-size:11px;font-weight:700;
    padding:8px 0;
    border:1px solid var(--field-border);
    background:var(--field-bg);
    color:var(--muted);
    cursor:pointer;
    border-radius:6px;
    text-align:center;
    letter-spacing:.06em;
  }
  .toggle[data-done="true"]{
    background:var(--good-soft);
    border-color:var(--good);
    color:var(--good);
  }
  .remove-row{
    background:none;border:none;color:var(--muted);
    font-size:18px;cursor:pointer;line-height:1;
    width:100%;
  }
  .remove-row:hover{color:var(--bad);}

  .add-row-btn{
    margin-top:12px;
    background:none;
    border:1px dashed var(--field-border);
    color:var(--accent);
    font-family:"Courier New",monospace;
    font-size:12.5px;
    padding:9px 14px;
    cursor:pointer;
    width:100%;
    border-radius:8px;
  }
  .add-row-btn:hover{background:var(--accent-soft);}

  /* ---------- Gauge (signature element) ---------- */
  .gauge-block{
    margin-top:20px;
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px 16px 10px;
    background:rgba(255,255,255,0.01);
  }
  .gauge-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .gauge-label{
    font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;
  }
  .gauge-value{
    font-family:"Courier New",monospace;
    font-size:18px;font-weight:700;
  }
  .gauge-value.state-ok{color:var(--good);}
  .gauge-value.state-warn{color:var(--avg);}
  .gauge-value.state-bad{color:var(--bad);}
  .gauge-track{
    position:relative;
    height:14px;
    background:var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:7px;
    overflow:hidden;
  }
  .gauge-fill{
    height:100%;
    transition:width .18s ease, background-color .18s ease;
  }
  .gauge-fill.state-ok{background:var(--good);}
  .gauge-fill.state-warn{background:var(--avg);}
  .gauge-fill.state-bad{background:var(--bad);}
  .gauge-ticks{
    display:flex;justify-content:space-between;
    font-family:"Courier New",monospace;
    font-size:10px;color:var(--muted);
    margin-top:3px;
  }

  /* ---------- Ledger ---------- */
  .ledger-empty{
    color:var(--muted);
    font-size:13.5px;
    padding:6px 2px 2px;
  }
  table.ledger{width:100%;border-collapse:collapse;font-size:13px;}
  table.ledger th{
    text-align:left;
    font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;
    padding:0 8px 8px 2px;
    border-bottom:1px solid var(--panel-border);
  }
  table.ledger td{
    padding:12px 8px 12px 2px;
    border-bottom:1px solid var(--panel-border);
    vertical-align:middle;
  }
  .badge{
    font-family:"Courier New",monospace;
    font-size:10.5px;font-weight:700;
    padding:3px 9px;
    border-radius:6px;
    text-transform:uppercase;
    letter-spacing:.04em;
    display:inline-block;
  }
  .badge.pending{background:var(--avg-soft);color:var(--avg);}
  .badge.initiated{background:var(--accent-soft);color:var(--accent);}
  .badge.final{background:var(--good-soft);color:var(--good);}
  .ledger-progress{display:flex;align-items:center;gap:8px;min-width:120px;}
  .mini-track{
    flex:1;height:8px;background:var(--field-bg);border:1px solid var(--field-border);border-radius:5px;overflow:hidden;
  }
  .mini-fill{height:100%;}
  .ledger-pct{font-family:"Courier New",monospace;font-size:12px;width:44px;text-align:right;}
  .del-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;
  }
  .del-btn:hover{color:var(--bad);}

  .expand-btn{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-size:13px;width:22px;text-align:center;
  }
  .expand-btn:disabled{color:var(--field-border);cursor:default;}
  table.ledger td:first-child{padding-right:0;width:22px;}
  tr.ledger-sub-row td{border-bottom:1px solid var(--panel-border);background:rgba(255,255,255,0.01);padding:10px 8px 14px 26px;}
  .ledger-milestones{display:flex;flex-direction:column;gap:8px;}
  .lm-item{
    display:grid;
    grid-template-columns:1fr 70px 64px;
    gap:12px;align-items:center;
  }
  .lm-name{font-size:13px;color:var(--text);}
  .lm-weight{font-family:"Courier New",monospace;font-size:12.5px;color:var(--muted);text-align:right;}
  .lm-toggle{width:64px;padding:6px 0;}

  .ledger-filters{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    margin-bottom:18px;padding-bottom:16px;
    border-bottom:1px solid var(--panel-border);
  }
  .ledger-filters select{flex:0 0 auto;min-width:140px;}
  .date-filter{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--muted);
  }
  .date-filter label{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  }
  .date-filter input[type=date]{padding:8px 8px;}
  .clear-filters-btn{
    background:none;
    border:1px solid var(--field-border);
    color:var(--muted);
    font-family:"Courier New",monospace;
    font-size:11.5px;
    padding:8px 12px;
    cursor:pointer;
    border-radius:8px;
    letter-spacing:.03em;
  }
  .clear-filters-btn:hover{color:var(--bad);border-color:var(--bad);}

  @media (max-width:640px){
    .ledger-filters{flex-direction:column;align-items:stretch;}
    .date-filter{flex-wrap:wrap;}
  }

  .storage-note{
    font-size:12px;color:var(--muted);
    border:1px dashed var(--field-border);
    border-radius:8px;
    padding:8px 12px;margin-bottom:20px;
    display:none;
  }
  .storage-note.show{display:block;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-size:13px;padding:10px 18px;border-radius:8px;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    font-family:inherit;
    z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:640px){
    .field-grid, .setup-selects{grid-template-columns:1fr;}
    .ms-head, .ms-row{grid-template-columns:1fr 80px 64px 26px;gap:6px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<header style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--panel-border);">
  <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--text);">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;"></span>
    Project Command Center
  </div>
  <div style="display:flex;gap:6px;background:var(--panel);border:1px solid var(--panel-border);border-radius:999px;padding:4px;">
    <span style="padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent);color:#1a1300;">Project Register</span>
  </div>
</header>
<div class="wrap">

  <div class="nameplate">
    <div class="eyebrow">AROPEX · Operational Excellence</div>
    <h1>Project Control Sheet</h1>
  </div>

  <div class="storage-note" id="storageNote">Saved data isn't available in this preview — open this file inside Claude.ai to keep entries between visits. It'll still work for the current session.</div>

  <!-- SECTION 01: PROJECT REGISTER -->
  <div class="section">
    <div class="section-head">
      <span class="section-id">01</span>
      <span class="section-title">Project Register</span>
    </div>
    <div class="section-body">
      <div class="field-grid">
        <div class="field">
          <label for="pName">Project Name</label>
          <input type="text" id="pName" placeholder="e.g. VSM – Delivery by Owned Truck">
        </div>
        <div class="field">
          <label for="pSbu">SBU Name</label>
          <select id="pSbu">
            <option value="">Select SBU…</option>
            <option value="ACCL">ACCL</option>
            <option value="APFIL">APFIL</option>
            <option value="FAL">FAL</option>
            <option value="MRML">MRML</option>
            <option value="M.OIL">M.OIL</option>
            <option value="AEFML">AEFML</option>
            <option value="AAFL">AAFL</option>
            <option value="ALEL">ALEL</option>
            <option value="AIL">AIL</option>
          </select>
        </div>
        <div class="field">
          <label for="pStart">Start Date</label>
          <input type="date" id="pStart">
        </div>
        <div class="field">
          <label for="pEnd">End Date</label>
          <input type="date" id="pEnd">
        </div>
        <div class="field full">
          <label for="pDesc">Description</label>
          <textarea id="pDesc" placeholder="What this project covers"></textarea>
        </div>
        <div class="field full">
          <label for="pBenefit">Benefits</label>
          <textarea id="pBenefit" placeholder="Expected impact / benefit"></textarea>
        </div>
        <div class="field full">
          <label for="pCostSavings">Expected Cost Savings</label>
          <textarea id="pCostSavings" placeholder="e.g. BDT 1,030 savings/month from reduced electricity use"></textarea>
        </div>
        <div class="field">
          <label for="pBudget">Estimated Budget</label>
          <input type="number" id="pBudget" min="0" step="0.01" placeholder="e.g. 150000">
        </div>
      </div>
      <div class="btn-row">
        <span class="hint" id="registerHint"></span>
        <button class="btn primary" id="registerBtn">Register Project</button>
      </div>
    </div>
  </div>

  <!-- SECTION 02: MILESTONE SETUP -->
  <div class="section">
    <div class="section-head">
      <span class="section-id">02</span>
      <span class="section-title">Project Setup</span>
    </div>
    <div class="section-body">
      <div class="setup-selects">
        <div class="field">
          <label for="setupSbu">SBU Name</label>
          <select id="setupSbu"><option value="">Select SBU…</option></select>
        </div>
        <div class="field">
          <label for="setupProject">Project Name</label>
          <select id="setupProject"><option value="">Select project…</option></select>
        </div>
      </div>

      <div class="ms-head">
        <span>Milestone</span><span>Weight (%)</span><span>Done</span><span></span>
      </div>
      <div id="msRows"></div>
      <button class="add-row-btn" id="addRowBtn" type="button">+ Add Milestone</button>

      <div class="gauge-block">
        <div class="gauge-top">
          <span class="gauge-label">Total weight</span>
          <span class="gauge-value" id="gaugeValue">0.00%</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill" id="gaugeFill" style="width:0%"></div></div>
        <div class="gauge-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
      </div>

      <div class="btn-row">
        <span class="hint" id="finalizeHint">Select a project to begin milestone setup.</span>
        <button class="btn confirm" id="finalizeBtn" disabled>Finalize Project</button>
      </div>
    </div>
  </div>

  <!-- LEDGER -->
  <div class="section">
    <div class="section-head">
      <span class="section-id">—</span>
      <span class="section-title">Running</span>
    </div>
    <div class="section-body">
      <div id="adminBar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--field-bg);">
        <span id="adminStatus" style="font-size:13px;color:var(--muted);">Signed out — delete disabled, milestones and actuals view-only</span>
        <span id="adminLoggedInBar" style="display:none;margin-left:auto;">
          <button id="adminLogoutBtn" type="button" class="btn small" style="background:none;border:1px solid var(--panel-border);color:var(--muted);">Log out admin</button>
        </span>
        <span id="adminLoginToggleWrap" style="margin-left:auto;">
          <button id="adminLoginToggleBtn" type="button" class="btn small" style="background:none;border:1px solid var(--panel-border);color:var(--muted);">Admin sign-in</button>
        </span>
      </div>
      <div id="adminLoginForm" style="display:none;gap:10px;margin:0 0 14px;padding:12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--field-bg);">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="adminIdInput" placeholder="Admin ID" autocomplete="off" style="flex:1;min-width:140px;">
          <input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="off" style="flex:1;min-width:140px;">
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:8px;">
          <button id="adminLoginSubmitBtn" type="button" class="btn confirm small">Sign in</button>
          <span id="adminLoginError" style="font-size:13px;color:var(--bad);"></span>
        </div>
      </div>

      <div class="ledger-filters">
        <select id="ledgerProjectFilter">
          <option value="">All projects</option>
        </select>
        <select id="ledgerSbuFilter">
          <option value="">All SBUs</option>
        </select>
        <select id="ledgerStatusFilter">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="initiated">Initiated</option>
          <option value="final">Final</option>
        </select>
        <div class="date-filter">
          <label for="ledgerFrom">From</label>
          <input type="date" id="ledgerFrom">
          <label for="ledgerTo">To</label>
          <input type="date" id="ledgerTo">
        </div>
        <button type="button" id="ledgerClear" class="clear-filters-btn">Clear filters</button>
      </div>
      <div id="ledgerBody">
        <div class="ledger-empty">No projects registered yet.</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1zZ68nxCL0XK0gPQDG5fsg_CqWCCBEU";
  const TABLE = "accl_projects";
  let projects = [];
  let currentMilestoneRows = []; // {id, name, weight, done}

  const $ = (id) => document.getElementById(id);
  const toastEl = $('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2600);
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function apiHeaders(extra){
    return Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, extra || {});
  }

  // --- Admin auth ---------------------------------------------------------
  // Deleting a project, toggling milestones, and editing actuals in the
  // "Running" ledger below require a signed-in admin session, enforced at
  // the database level for delete (RLS on accl_projects). Registering a
  // new project and setting up its initial milestones above stays open to
  // everyone. Uses the same shared admin account as the rest of the hub.
  const ADMIN_LOGIN_ID = "OPEX";
  const ADMIN_AUTH_EMAIL = "opex@command-center.internal"; // internal auth identifier, not a real mailbox
  const ADMIN_SESSION_KEY = "project_ledger_admin_session_v1";

  let adminSession = loadAdminSession();

  function loadAdminSession(){
    try{
      const raw = localStorage.getItem(ADMIN_SESSION_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed.access_token || !parsed.expires_at || parsed.expires_at <= Date.now()){
        localStorage.removeItem(ADMIN_SESSION_KEY);
        return null;
      }
      return parsed;
    }catch(e){ return null; }
  }

  function isAdmin(){
    return !!(adminSession && adminSession.expires_at > Date.now());
  }

  async function adminLogin(loginId, password){
    if((loginId || "").trim().toUpperCase() !== ADMIN_LOGIN_ID){
      throw new Error("Unknown admin ID.");
    }
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: ADMIN_AUTH_EMAIL, password: password })
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.access_token){
      throw new Error(data.error_description || data.msg || "Sign-in failed.");
    }
    adminSession = { access_token: data.access_token, expires_at: Date.now() + (data.expires_in || 3600) * 1000 };
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(adminSession));
    return adminSession;
  }

  function adminLogout(){
    adminSession = null;
    localStorage.removeItem(ADMIN_SESSION_KEY);
  }

  function refreshAdminBar(){
    const status = $("adminStatus");
    const loggedInBar = $("adminLoggedInBar");
    const toggleWrap = $("adminLoginToggleWrap");
    const loginForm = $("adminLoginForm");
    if(!status) return;
    if(isAdmin()){
      status.textContent = "Signed in as admin — delete, milestones, and actuals enabled";
      loggedInBar.style.display = "inline";
      toggleWrap.style.display = "none";
      loginForm.style.display = "none";
    } else {
      status.textContent = "Signed out — delete disabled, milestones and actuals view-only";
      loggedInBar.style.display = "none";
      toggleWrap.style.display = "inline";
    }
  }

  function fromDbRow(row){
    return {
      id: String(row.id),
      name: row.project_name,
      sbu: row.sbu,
      start: row.start_date || '',
      end: row.end_date || '',
      desc: row.description || '',
      benefit: row.benefits || '',
      costSavings: row.expected_cost_savings || '',
      budget: row.estimated_budget === null || row.estimated_budget === undefined ? '' : row.estimated_budget,
      status: row.status || 'pending',
      milestones: Array.isArray(row.milestones) ? row.milestones : [],
      progress: row.progress === null || row.progress === undefined ? 0 : Number(row.progress),
      actualSavings: row.actual_savings === null || row.actual_savings === undefined ? '' : row.actual_savings,
      actualBudget: row.actual_budget === null || row.actual_budget === undefined ? '' : row.actual_budget,
      actualDetails: row.actual_details || ''
    };
  }

  function computeProgress(project){
    if(project.milestones && project.milestones.length > 0){
      return project.milestones.filter(m=>m.done).reduce((s,m)=>s+(Number(m.weight)||0),0);
    }
    return project.progress || 0;
  }

  function toDbPayload(project){
    return {
      sbu: project.sbu,
      project_name: project.name,
      start_date: project.start || null,
      end_date: project.end || null,
      description: project.desc || null,
      benefits: project.benefit || null,
      expected_cost_savings: project.costSavings || null,
      estimated_budget: project.budget === '' || project.budget === null || project.budget === undefined ? null : Number(project.budget),
      status: project.status || 'pending',
      milestones: project.milestones || [],
      progress: computeProgress(project),
      actual_savings: project.actualSavings === '' || project.actualSavings === null || project.actualSavings === undefined ? null : Number(project.actualSavings),
      actual_budget: project.actualBudget === '' || project.actualBudget === null || project.actualBudget === undefined ? null : Number(project.actualBudget),
      actual_details: project.actualDetails || null
    };
  }

  async function loadProjects(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc`, { headers: apiHeaders() });
      if(!res.ok) throw new Error('Fetch failed: ' + res.status);
      const rows = await res.json();
      projects = rows.map(fromDbRow);
    }catch(e){
      console.error(e);
      toast('Could not load projects from Supabase.');
      projects = [];
    }
  }

  async function insertProject(project){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: apiHeaders({ 'Prefer': 'return=representation' }),
      body: JSON.stringify(toDbPayload(project))
    });
    if(!res.ok){
      const text = await res.text();
      throw new Error('Insert failed: ' + res.status + ' ' + text);
    }
    const rows = await res.json();
    return fromDbRow(Array.isArray(rows) ? rows[0] : rows);
  }

  async function updateProjectDb(project){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${project.id}`, {
      method: 'PATCH',
      headers: apiHeaders({ 'Prefer': 'return=representation' }),
      body: JSON.stringify(toDbPayload(project))
    });
    if(!res.ok){
      const text = await res.text();
      throw new Error('Update failed: ' + res.status + ' ' + text);
    }
    const rows = await res.json();
    return fromDbRow(Array.isArray(rows) ? rows[0] : rows);
  }

  async function deleteProjectDb(id){
    if(!isAdmin()) throw new Error("Admin sign-in required to delete.");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'DELETE',
      headers: apiHeaders({ "Authorization": "Bearer " + adminSession.access_token })
    });
    if(!res.ok) throw new Error('Delete failed: ' + res.status);
  }

  // ---------- SECTION 01 ----------
  $('registerBtn').addEventListener('click', async ()=>{
    const name = $('pName').value.trim();
    const sbu = $('pSbu').value.trim();
    const start = $('pStart').value;
    const end = $('pEnd').value;
    const desc = $('pDesc').value.trim();
    const benefit = $('pBenefit').value.trim();
    const costSavings = $('pCostSavings').value.trim();
    const budget = $('pBudget').value;
    const hint = $('registerHint');

    if(!name || !sbu){
      hint.textContent = 'Project Name and SBU Name are required.';
      hint.style.color = 'var(--bad)';
      return;
    }
    if(projects.some(p => p.name.toLowerCase() === name.toLowerCase())){
      hint.textContent = 'A project with this name is already registered.';
      hint.style.color = 'var(--bad)';
      return;
    }
    const registerBtn = $('registerBtn');
    registerBtn.disabled = true;
    registerBtn.textContent = 'Registering...';
    try{
      const inserted = await insertProject({
        name, sbu, start, end, desc, benefit, costSavings, budget,
        status: 'pending', milestones: [], progress: 0
      });
      projects.push(inserted);
      ['pName','pSbu','pStart','pEnd','pDesc','pBenefit','pCostSavings','pBudget'].forEach(id => $(id).value = '');
      hint.textContent = '';
      toast('"' + name + '" registered.');
      refreshSetupDropdowns();
      renderLedger();
    }catch(e){
      console.error(e);
      hint.textContent = 'Could not save this project. Please try again.';
      hint.style.color = 'var(--bad)';
    }finally{
      registerBtn.disabled = false;
      registerBtn.textContent = 'Register Project';
    }
  });

  // ---------- SECTION 02 ----------
  const SBU_LIST = ['ACCL','APFIL','FAL','MRML','M.OIL','AEFML','AAFL','ALEL','AIL'];

  function refreshSetupDropdowns(){
    const sbuSel = $('setupSbu');
    const currentSbu = sbuSel.value;
    sbuSel.innerHTML = '<option value="">Select SBU…</option>' +
      SBU_LIST.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    if(SBU_LIST.includes(currentSbu)) sbuSel.value = currentSbu;
    populateProjectDropdown();
  }

  function populateProjectDropdown(){
    const sbu = $('setupSbu').value;
    const projSel = $('setupProject');
    const currentProj = projSel.value;
    const list = projects.filter(p => !sbu || p.sbu === sbu);
    projSel.innerHTML = '<option value="">Select project…</option>' +
      list.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}${p.status==='finalized' ? ' (finalized)' : ''}</option>`).join('');
    if(list.some(p=>p.id === currentProj)) projSel.value = currentProj;
    else loadMilestoneEditor(null);
  }

  $('setupSbu').addEventListener('change', populateProjectDropdown);
  $('setupProject').addEventListener('change', (e)=> loadMilestoneEditor(e.target.value || null));

  function loadMilestoneEditor(projectId){
    const project = projects.find(p=>p.id === projectId);
    if(!project){
      currentMilestoneRows = [];
      renderMilestoneRows();
      $('finalizeBtn').disabled = true;
      $('finalizeHint').textContent = 'Select a project to begin milestone setup.';
      return;
    }
    currentMilestoneRows = project.milestones.length
      ? project.milestones.map(m => ({...m}))
      : [{id:uid(), name:'', weight:'', done:false}, {id:uid(), name:'', weight:'', done:false}, {id:uid(), name:'', weight:'', done:false}];
    renderMilestoneRows();
  }

  function addMilestoneRow(){
    currentMilestoneRows.push({id:uid(), name:'', weight:'', done:false});
    renderMilestoneRows();
  }
  $('addRowBtn').addEventListener('click', addMilestoneRow);

  function renderMilestoneRows(){
    const wrap = $('msRows');
    wrap.innerHTML = '';
    currentMilestoneRows.forEach(row=>{
      const el = document.createElement('div');
      el.className = 'ms-row';
      el.dataset.id = row.id;
      el.innerHTML = `
        <input type="text" class="ms-name" placeholder="Milestone name" value="${escapeHtml(row.name)}">
        <input type="number" class="ms-weight" min="0" max="100" step="0.01" placeholder="0.00" value="${row.weight === '' ? '' : row.weight}">
        <button type="button" class="toggle" data-done="${row.done}">${row.done ? 'YES' : 'NO'}</button>
        <button type="button" class="remove-row" aria-label="Remove milestone">×</button>
      `;
      el.querySelector('.ms-name').addEventListener('input', e=>{ row.name = e.target.value; updateGaugeAndHint(); });
      el.querySelector('.ms-weight').addEventListener('input', e=>{ row.weight = e.target.value; updateGaugeAndHint(); });
      const toggleBtn = el.querySelector('.toggle');
      toggleBtn.addEventListener('click', ()=>{
        row.done = !row.done;
        toggleBtn.dataset.done = row.done;
        toggleBtn.textContent = row.done ? 'YES' : 'NO';
        updateGaugeAndHint();
      });
      el.querySelector('.remove-row').addEventListener('click', ()=>{
        currentMilestoneRows = currentMilestoneRows.filter(r=>r.id !== row.id);
        renderMilestoneRows();
      });
      wrap.appendChild(el);
    });
    updateGaugeAndHint();
  }

  function currentWeightSum(){
    return currentMilestoneRows.reduce((sum,r)=> sum + (Number(r.weight) || 0), 0);
  }

  let syncDebounceTimer = null;
  function debouncedPersistMilestones(project){
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(async () => {
      try{ await updateProjectDb(project); }
      catch(e){ console.error(e); toast('Could not save milestones.'); }
    }, 700);
  }

  function syncMilestonesToProject(){
    const projectId = $('setupProject').value;
    const project = projects.find(p=>p.id === projectId);
    if(!project) return;
    project.milestones = currentMilestoneRows
      .filter(r => r.name.trim())
      .map(r => ({id:r.id, name:r.name.trim(), weight:Number(r.weight)||0, done:!!r.done}));
    debouncedPersistMilestones(project);
    renderLedger();
  }

  function updateGaugeAndHint(){
    syncMilestonesToProject();
    const sum = currentWeightSum();
    const gaugeValue = $('gaugeValue');
    const gaugeFill = $('gaugeFill');
    let state = 'warn';
    if(Math.abs(sum - 100) < 0.01) state = 'ok';
    else if(sum > 100) state = 'bad';
    gaugeValue.textContent = sum.toFixed(2) + '%';
    gaugeValue.className = 'gauge-value state-' + state;
    gaugeFill.className = 'gauge-fill state-' + state;
    gaugeFill.style.width = Math.min(sum,100) + '%';

    const projSelected = !!$('setupProject').value;
    const hint = $('finalizeHint');
    const finalizeBtn = $('finalizeBtn');
    if(!projSelected){
      hint.textContent = 'Select a project to begin milestone setup.';
      finalizeBtn.disabled = true;
    } else if(state !== 'ok'){
      hint.textContent = 'Total weight must equal exactly 100% to finalize.';
      finalizeBtn.disabled = true;
    } else if(currentMilestoneRows.some(r => r.weight !== '' && !r.name.trim())){
      hint.textContent = 'Every weighted row needs a milestone name.';
      finalizeBtn.disabled = true;
    } else {
      hint.textContent = 'Ready to finalize.';
      finalizeBtn.disabled = false;
    }
  }

  $('finalizeBtn').addEventListener('click', async ()=>{
    const projectId = $('setupProject').value;
    const project = projects.find(p=>p.id === projectId);
    if(!project) return;
    const cleanRows = currentMilestoneRows
      .filter(r => r.name.trim())
      .map(r => ({id:r.id, name:r.name.trim(), weight:Number(r.weight)||0, done:!!r.done}));
    project.milestones = cleanRows;
    project.status = 'finalized';
    if(computeProjectProgress(project) >= 100) expandedIds.add(project.id);
    clearTimeout(syncDebounceTimer);
    const finalizeBtn = $('finalizeBtn');
    finalizeBtn.disabled = true;
    finalizeBtn.textContent = 'Finalizing...';
    try{
      await updateProjectDb(project);
      toast('"' + project.name + '" finalized.');
      $('setupSbu').value = '';
      $('setupProject').innerHTML = '<option value="">Select project…</option>';
      loadMilestoneEditor(null);
      refreshSetupDropdowns();
      renderLedger();
    }catch(e){
      console.error(e);
      toast('Could not finalize this project. Please try again.');
    }finally{
      finalizeBtn.textContent = 'Finalize Project';
      updateGaugeAndHint();
    }
  });

  // ---------- LEDGER ----------
  let expandedIds = new Set();
  let filters = { project:'', sbu:'', status:'all', from:'', to:'' };

  $('ledgerProjectFilter').addEventListener('change', e=>{ filters.project = e.target.value; renderLedger(); });
  $('ledgerSbuFilter').addEventListener('change', e=>{ filters.sbu = e.target.value; renderLedger(); });
  $('ledgerStatusFilter').addEventListener('change', e=>{ filters.status = e.target.value; renderLedger(); });
  $('ledgerFrom').addEventListener('change', e=>{ filters.from = e.target.value; renderLedger(); });
  $('ledgerTo').addEventListener('change', e=>{ filters.to = e.target.value; renderLedger(); });
  $('ledgerClear').addEventListener('click', ()=>{
    filters = { project:'', sbu:'', status:'all', from:'', to:'' };
    $('ledgerProjectFilter').value = '';
    $('ledgerSbuFilter').value = '';
    $('ledgerStatusFilter').value = 'all';
    $('ledgerFrom').value = '';
    $('ledgerTo').value = '';
    renderLedger();
  });

  function refreshLedgerFilterDropdowns(){
    const projSel = $('ledgerProjectFilter');
    const sbuSel = $('ledgerSbuFilter');
    const keepProj = projSel.value;
    const keepSbu = sbuSel.value;
    const names = [...new Set(projects.map(p=>p.name))].sort();
    projSel.innerHTML = '<option value="">All projects</option>' +
      names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    sbuSel.innerHTML = '<option value="">All SBUs</option>' +
      SBU_LIST.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    if(names.includes(keepProj)) projSel.value = keepProj; else filters.project = '';
    if(SBU_LIST.includes(keepSbu)) sbuSel.value = keepSbu; else filters.sbu = '';
  }

  function computeStatus(progress){
    if(progress === null || progress <= 0) return 'pending';
    if(progress >= 100) return 'final';
    return 'initiated';
  }

  function projectMatchesFilters(p, progress){
    if(filters.project && p.name !== filters.project) return false;
    if(filters.sbu && p.sbu !== filters.sbu) return false;
    if(filters.status !== 'all' && computeStatus(progress) !== filters.status) return false;
    // date range overlap: project's [start,end] intersects the [from,to] filter window
    if(filters.from && p.end && p.end < filters.from) return false;
    if(filters.from && !p.end && p.start && p.start < filters.from) return false;
    if(filters.to && p.start && p.start > filters.to) return false;
    return true;
  }

  async function toggleMilestoneDoneFromLedger(projectId, milestoneId){
    const project = projects.find(p=>p.id === projectId);
    if(!project) return;
    const m = project.milestones.find(x=>x.id === milestoneId);
    if(!m) return;
    m.done = !m.done;
    if(computeProjectProgress(project) >= 100) expandedIds.add(projectId);
    renderLedger();

    // keep Section 02 editor in sync if this same project is currently loaded there
    if($('setupProject').value === projectId){
      const row = currentMilestoneRows.find(r=>r.id === milestoneId);
      if(row) row.done = m.done;
      renderMilestoneRows();
    }
    try{ await updateProjectDb(project); }
    catch(e){ console.error(e); toast('Could not save this change.'); }
  }

  async function saveActualsForProject(projectId){
    const project = projects.find(p=>p.id === projectId);
    if(!project) return;
    const savingsInput = document.querySelector(`.actual-savings-input[data-project="${projectId}"]`);
    const budgetInput = document.querySelector(`.actual-budget-input[data-project="${projectId}"]`);
    const detailsInput = document.querySelector(`.actual-details-input[data-project="${projectId}"]`);
    const hintEl = document.getElementById('actualsHint-'+projectId);
    const btn = document.querySelector(`.actuals-save-btn[data-project="${projectId}"]`);

    const actualSavings = savingsInput.value === '' ? null : Number(savingsInput.value);
    const actualBudget = budgetInput.value === '' ? null : Number(budgetInput.value);
    const actualDetails = detailsInput.value.trim() || null;

    btn.disabled = true;
    btn.textContent = 'Saving...';
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${projectId}`, {
        method: 'PATCH',
        headers: apiHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ actual_savings: actualSavings, actual_budget: actualBudget, actual_details: actualDetails })
      });
      if(!res.ok){
        const text = await res.text();
        throw new Error('Save failed: ' + res.status + ' ' + text);
      }
      project.actualSavings = actualSavings === null ? '' : actualSavings;
      project.actualBudget = actualBudget === null ? '' : actualBudget;
      project.actualDetails = actualDetails || '';
      if(hintEl){ hintEl.textContent = 'Saved.'; hintEl.style.color = 'var(--good)'; }
      toast('Actuals saved for "' + project.name + '".');
    }catch(e){
      console.error(e);
      if(hintEl){ hintEl.textContent = 'Could not save — try again.'; hintEl.style.color = 'var(--bad)'; }
      toast('Could not save actuals.');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Save Actuals';
    }
  }

  function renderLedger(){
    refreshLedgerFilterDropdowns();
    const body = $('ledgerBody');
    if(projects.length === 0){
      body.innerHTML = '<div class="ledger-empty">No projects registered yet.</div>';
      return;
    }
    const withProgress = projects.map(p=>{
      const hasMilestones = p.milestones && p.milestones.length > 0;
      const progress = hasMilestones
        ? p.milestones.filter(m=>m.done).reduce((s,m)=>s+m.weight,0)
        : (p.progress ? p.progress : null);
      return {p, hasMilestones, progress};
    });
    const visible = withProgress.filter(({p, progress}) => projectMatchesFilters(p, progress));

    if(visible.length === 0){
      body.innerHTML = '<div class="ledger-empty">No projects match these filters.</div>';
      return;
    }

    const rows = visible.map(({p, hasMilestones, progress})=>{
      let fillClass = 'state-warn';
      if(progress !== null){
        fillClass = progress >= 100 ? 'state-ok' : progress >= 50 ? 'state-warn' : 'state-bad';
      }
      const dateRange = (p.start || p.end) ? `${p.start || '—'} → ${p.end || '—'}` : '—';
      const isOpen = expandedIds.has(p.id);
      let statusLabel, statusClass;
      if(progress === null || progress <= 0){
        statusLabel = 'pending'; statusClass = 'pending';
      } else if(progress >= 100){
        statusLabel = 'final'; statusClass = 'final';
      } else {
        statusLabel = 'initiated'; statusClass = 'initiated';
      }
      const mainRow = `
        <tr>
          <td>
            <button class="expand-btn" data-id="${p.id}" aria-label="Toggle details">${isOpen ? '▾' : '▸'}</button>
          </td>
          <td>${escapeHtml(p.name)}<br><span style="color:var(--muted);font-size:11.5px;">${escapeHtml(dateRange)}</span></td>
          <td>${escapeHtml(p.sbu)}</td>
          <td><span class="badge ${statusClass}">${statusLabel}</span></td>
          <td>
            ${progress === null
              ? '<span style="color:var(--muted);">—</span>'
              : `<div class="ledger-progress"><div class="mini-track"><div class="mini-fill ${fillClass}" style="width:${Math.min(progress,100)}%;background:var(--${fillClass==='state-ok'?'good':fillClass==='state-warn'?'avg':'bad'})"></div></div><span class="ledger-pct">${progress.toFixed(1)}%</span></div>`}
          </td>
          <td>${isAdmin() ? `<button class="del-btn" data-id="${p.id}" aria-label="Delete project">🗑</button>` : ''}</td>
        </tr>`;
      const detailParts = [];
      if(p.desc) detailParts.push(`<strong style="color:var(--text);">Description:</strong> ${escapeHtml(p.desc)}`);
      if(p.benefit) detailParts.push(`<strong style="color:var(--text);">Benefits:</strong> ${escapeHtml(p.benefit)}`);
      if(p.costSavings) detailParts.push(`<strong style="color:var(--text);">Expected Cost Savings:</strong> ${escapeHtml(p.costSavings)}`);
      if(p.budget !== undefined && p.budget !== '' && p.budget !== null) detailParts.push(`<strong style="color:var(--text);">Estimated Budget:</strong> ${escapeHtml(p.budget)}`);
      const subRow = isOpen ? `
        <tr class="ledger-sub-row">
          <td></td>
          <td colspan="5">
            <div class="ledger-milestones">
              ${detailParts.length ? `<div class="lm-item" style="grid-template-columns:1fr;"><span class="lm-name" style="color:var(--muted);line-height:1.6;">${detailParts.join('<br>')}</span></div>` : ''}
              ${p.milestones.map(m => `
                <div class="lm-item">
                  <span class="lm-name">${escapeHtml(m.name)}</span>
                  <span class="lm-weight">${m.weight.toFixed(2)}%</span>
                  ${isAdmin()
                    ? `<button type="button" class="toggle lm-toggle" data-project="${p.id}" data-milestone="${m.id}" data-done="${m.done}">${m.done ? 'YES' : 'NO'}</button>`
                    : `<span class="toggle" style="opacity:.7;">${m.done ? 'YES' : 'NO'}</span>`}
                </div>`).join('')}
            </div>
            ${progress !== null && progress >= 100 && isAdmin() ? `
              <div class="actuals-block">
                <div class="actuals-title">Completed — Actuals</div>
                <div class="field-grid">
                  <div class="field">
                    <label>Actual Savings</label>
                    <input type="number" step="0.01" class="actual-savings-input" data-project="${p.id}" value="${p.actualSavings===''?'':p.actualSavings}" placeholder="e.g. 42000">
                  </div>
                  <div class="field">
                    <label>Actual Budget</label>
                    <input type="number" step="0.01" class="actual-budget-input" data-project="${p.id}" value="${p.actualBudget===''?'':p.actualBudget}" placeholder="e.g. 148000">
                  </div>
                  <div class="field full">
                    <label>Actual Details</label>
                    <textarea class="actual-details-input" data-project="${p.id}" placeholder="What actually happened — final figures, notes, learnings…">${escapeHtml(p.actualDetails||'')}</textarea>
                  </div>
                </div>
                <div class="btn-row">
                  <span class="hint" id="actualsHint-${p.id}"></span>
                  <button type="button" class="btn small confirm actuals-save-btn" data-project="${p.id}">Save Actuals</button>
                </div>
              </div>
            ` : progress !== null && progress >= 100 && (p.actualSavings !== '' || p.actualBudget !== '' || p.actualDetails) ? `
              <div class="actuals-block">
                <div class="actuals-title">Completed — Actuals</div>
                <div class="ledger-milestones" style="grid-template-columns:1fr;">
                  ${p.actualSavings !== '' ? `<div class="lm-item" style="grid-template-columns:1fr;"><span class="lm-name" style="color:var(--muted);">Actual Savings: ${escapeHtml(p.actualSavings)}</span></div>` : ''}
                  ${p.actualBudget !== '' ? `<div class="lm-item" style="grid-template-columns:1fr;"><span class="lm-name" style="color:var(--muted);">Actual Budget: ${escapeHtml(p.actualBudget)}</span></div>` : ''}
                  ${p.actualDetails ? `<div class="lm-item" style="grid-template-columns:1fr;"><span class="lm-name" style="color:var(--muted);">${escapeHtml(p.actualDetails)}</span></div>` : ''}
                </div>
              </div>
            ` : ''}
          </td>
        </tr>` : '';
      return mainRow + subRow;
    }).join('');
    body.innerHTML = `
      <table class="ledger">
        <thead><tr><th></th><th>Project</th><th>SBU</th><th>Status</th><th>Progress</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    body.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
        renderLedger();
      });
    });
    body.querySelectorAll('.lm-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        toggleMilestoneDoneFromLedger(btn.dataset.project, btn.dataset.milestone);
      });
    });
    body.querySelectorAll('.actuals-save-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> saveActualsForProject(btn.dataset.project));
    });
    body.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const p = projects.find(x=>x.id===id);
        if(!p) return;
        if(!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
        btn.disabled = true;
        try{
          await deleteProjectDb(id);
          projects = projects.filter(x=>x.id!==id);
          expandedIds.delete(id);
          refreshSetupDropdowns();
          renderLedger();
        }catch(e){
          console.error(e);
          toast('Could not delete this project. Please try again.');
          btn.disabled = false;
        }
      });
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- INIT ----------
  function computeProjectProgress(p){
    const hasMilestones = p.milestones && p.milestones.length > 0;
    return hasMilestones
      ? p.milestones.filter(m=>m.done).reduce((s,m)=>s+m.weight,0)
      : (p.progress ? p.progress : null);
  }

  $('adminLoginToggleBtn').addEventListener('click', () => {
    const form = $('adminLoginForm');
    form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    form.style.flexDirection = 'column';
  });

  $('adminLogoutBtn').addEventListener('click', () => {
    adminLogout();
    refreshAdminBar();
    renderLedger();
  });

  $('adminLoginSubmitBtn').addEventListener('click', async () => {
    const loginId = $('adminIdInput').value;
    const password = $('adminPasswordInput').value;
    const errEl = $('adminLoginError');
    const btn = $('adminLoginSubmitBtn');
    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
      await adminLogin(loginId, password);
      $('adminIdInput').value = '';
      $('adminPasswordInput').value = '';
      refreshAdminBar();
      renderLedger();
    } catch (err) {
      errEl.textContent = err.message || 'Sign-in failed.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  (async function init(){
    refreshAdminBar();
    await loadProjects();
    // Auto-expand already-completed projects so their Actuals section is
    // visible immediately, instead of being hidden behind the collapsed row.
    projects.forEach(p => { if(computeProjectProgress(p) >= 100) expandedIds.add(p.id); });
    refreshSetupDropdowns();
    loadMilestoneEditor(null);
    renderLedger();
  })();
})();
%%ENDSCRIPT%%>
</body>
</html>
</script>
<script type="text/plain" id="tpl-process"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Process Standardization Index</title>
<style>
  :root{
    --blue:#1a56c4; --blue-dark:#0e3a8f;
    --ink:#1c2430; --sub:#5b6472; --line:#e2e5ea;
    --bg:#f3f4f7; --card:#ffffff;
    --ok:#1a7f4a; --ok-bg:#e6f5ec;
    --fail:#c23b3b; --fail-bg:#fbe9e9;
    --warn:#b5750f; --warn-bg:#fbf1e0;
    --prog:#1a56c4; --prog-bg:#e8eefc;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);}
  .topbar{background:var(--blue-dark);color:#fff;padding:14px 28px;font-size:15px;font-weight:600;letter-spacing:.2px;}
  .wrap{max-width:900px;margin:32px auto 60px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 32px;box-shadow:0 1px 3px rgba(20,30,50,.06);margin-bottom:20px;}
  h1{font-size:20px;margin:0 0 4px;color:var(--blue-dark);}
  .subtitle{color:var(--sub);font-size:13px;margin:0 0 22px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd4dc;border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,196,.12);}
  textarea{resize:vertical;min-height:80px;}
  .full{grid-column:1/-1;}
  button{padding:11px 18px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;}
  button:hover{background:var(--blue-dark);}
  button:disabled{background:#b9c3d6;cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--blue);border:1px solid #cfd4dc;}
  .btn-secondary:hover{background:#eef1f6;}
  .btn-finalize{background:#fff;color:var(--ok);border:1px solid #bfe4cd;}
  .btn-finalize:hover{background:var(--ok-bg);}
  .btn-finalize.active{background:var(--ok);color:#fff;}
  .full-btn{width:100%;}
  .summary-box{display:none;margin-top:14px;}
  .summary-box.show{display:block;}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .msg.error{background:var(--fail-bg);color:var(--fail);}

  /* month progress tracker */
  .tracker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .tracker-stat{display:flex;flex-direction:column;}
  .tracker-num{font-size:26px;font-weight:700;color:var(--blue-dark);}
  .tracker-label{font-size:12px;color:var(--sub);}
  .tracker-bar-wrap{flex:1;min-width:160px;}
  .tracker-bar-bg{height:10px;background:#e8eaee;border-radius:6px;overflow:hidden;}
  .tracker-bar-fill{height:100%;background:var(--ok);border-radius:6px;transition:width .3s;}
  .tracker-bar-fill.behind{background:var(--warn);}
  .tracker-note{font-size:12px;color:var(--sub);margin-top:5px;}
  .month-select{width:auto;}

  /* filters */
  .filter-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .filter-actions{display:flex;gap:10px;margin-top:4px;}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  th{color:var(--sub);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;}
  .pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.not-started{background:#f1f2f5;color:var(--sub);}
  .pill.in-progress{background:var(--prog-bg);color:var(--prog);}
  .pill.completed{background:var(--ok-bg);color:var(--ok);}
  .pill.final{background:#efe7fb;color:#6a3fb5;}
  .empty{color:#9aa1ab;font-size:13px;padding:14px 0;text-align:center;}
  .del-btn{padding:4px 10px;background:transparent;color:var(--fail);border:1px solid #f2c3c3;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;}
  .del-btn:hover{background:var(--fail-bg);}
  .status-select{font-size:12px;padding:5px 7px;}
  .fin-btn-sm{font-size:11px;padding:5px 10px;border-radius:6px;}
  .summary-cell{max-width:220px;font-size:11.5px;color:var(--sub);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .name-row{display:flex;gap:8px;margin-bottom:8px;}
  .name-row input{flex:1;}
  .name-row .remove-name-btn{padding:0 12px;background:transparent;color:var(--fail);border:1px solid #f2c3c3;border-radius:8px;font-size:16px;line-height:1;cursor:pointer;}
  .name-row .remove-name-btn:hover{background:var(--fail-bg);}
</style>

<body>

<div class="topbar">Lean Manufacturing &nbsp;/&nbsp; Process Standardization Index</div>

<div class="wrap">

  <div class="card">
    <h1>Monthly progress</h1>
    <p class="subtitle">Target: minimum 2 process standardization projects completed per month.</p>
    <div class="tracker">
      <select id="trackerMonth" class="month-select"></select>
      <div class="tracker-stat">
        <div class="tracker-num" id="trackerCount">0 / 2</div>
        <div class="tracker-label">Completed this month</div>
      </div>
      <div class="tracker-bar-wrap">
        <div class="tracker-bar-bg"><div class="tracker-bar-fill" id="trackerBar" style="width:0%"></div></div>
        <div class="tracker-note" id="trackerNote">Loading…</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h1>New project entry</h1>
    <p class="subtitle">Register a new process standardization project.</p>

    <div class="row">
      <div class="field">
        <label>Start date</label>
        <input type="date" id="startDate">
      </div>
      <div class="field">
        <label>SBU</label>
        <select id="sbu">
          <option value="">Select SBU</option>
          <option>ACCL</option>
          <option>AIL</option>
          <option>AAFL</option>
          <option>AEL(Flour)</option>
          <option>APFIL</option>
          <option>HRML</option>
          <option>MRML</option>
          <option>FAL</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field full">
        <label>Project name(s)</label>
        <div id="projectNameList"></div>
        <button type="button" id="addNameBtn" class="btn-secondary" style="margin-top:8px;padding:7px 14px;font-size:13px;">+ Add another project name</button>
      </div>
    </div>

    <button type="button" id="addBtn" class="full-btn">Add project</button>
    <div class="msg ok" id="msg">Project added below.</div>
  </div>

  <div class="card">
    <h1>Project register</h1>
    <p class="subtitle" style="margin-bottom:14px;">Editing status, finalizing, and deleting entries requires admin sign-in. Anyone can view and add new projects above.</p>

    <div id="adminBar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f7f8fa;">
      <span id="adminStatus" style="font-size:13px;color:var(--sub);">Signed out — viewing as everyone else</span>
      <span id="adminLoggedInBar" style="display:none;margin-left:auto;">
        <button id="adminLogoutBtn" type="button" class="btn-secondary" style="width:auto;margin:0;padding:6px 14px;font-size:12px;">Log out admin</button>
      </span>
      <span id="adminLoginToggleWrap" style="margin-left:auto;">
        <button id="adminLoginToggleBtn" type="button" class="btn-secondary" style="width:auto;margin:0;padding:6px 14px;font-size:12px;">Admin sign-in</button>
      </span>
    </div>
    <div id="adminLoginForm" style="display:none;gap:10px;margin:0 0 16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f7f8fa;">
      <div class="row" style="margin-bottom:0;">
        <div class="field">
          <label>Admin ID</label>
          <input type="text" id="adminIdInput" placeholder="Admin ID" autocomplete="off">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="off">
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:6px;">
        <button id="adminLoginSubmitBtn" type="button" style="width:auto;padding:8px 18px;">Sign in</button>
        <span id="adminLoginError" style="font-size:13px;color:var(--fail);"></span>
      </div>
    </div>

    <div class="filter-row">
      <div class="field">
        <label>SBU</label>
        <select id="fSbu"><option value="">All</option></select>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fStatus">
          <option value="">All</option>
          <option value="Not Started">Not started</option>
          <option value="In Progress">In progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="field">
        <label>From date</label>
        <input type="date" id="fFrom">
      </div>
      <div class="field">
        <label>To date</label>
        <input type="date" id="fTo">
      </div>
    </div>
    <div class="filter-actions" style="margin-bottom:20px;">
      <button id="applyFilter">Apply filters</button>
      <button id="resetFilter" type="button" class="btn-secondary">Reset</button>
    </div>

    <table>
      <thead><tr>
        <th>Start date</th><th>SBU</th><th>Project name</th><th>Status</th><th>Summary</th><th></th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p class="empty" id="emptyMsg">No entries yet.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">%%ENDSCRIPT%%>
<script>
const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwd2JjdXh3eGtxdmF1ZmZxb29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjA4NjEsImV4cCI6MjA5OTM5Njg2MX0.iAoIZXl-2G7h3wm4jcYsEs6-wdN-YKTS-KbBteBBzUk";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  global: {
    // Some sandboxed/preview environments instrument window.fetch and try to
    // postMessage the request details to a parent frame for logging. A native
    // Headers object can't be structured-cloned, which throws DataCloneError
    // and silently breaks the request. Passing headers as a plain object avoids it.
    fetch: (url, options = {}) => {
      const plainHeaders = {};
      if(options.headers){
        if(options.headers instanceof Headers){
          options.headers.forEach((v,k)=> plainHeaders[k] = v);
        } else {
          Object.assign(plainHeaders, options.headers);
        }
      }
      return window.fetch(url, { ...options, headers: plainHeaders });
    }
  }
});
const TABLE = "accl_process_standardization";
const MONTHLY_TARGET = 2;

// --- Admin auth ----------------------------------------------------------
// Editing status, finalizing, and deleting project register entries
// requires a signed-in admin session, enforced at the database level
// (RLS): the anon key alone can no longer update or delete rows in
// accl_process_standardization. Uses the same shared admin account as
// the rest of the hub. Adding new projects stays open to everyone.
const ADMIN_LOGIN_ID = "OPEX";
const ADMIN_AUTH_EMAIL = "opex@command-center.internal"; // internal auth identifier, not a real mailbox

let currentAdminSession = null;

function isAdmin() {
  return !!currentAdminSession;
}

async function adminLogin(loginId, password) {
  if ((loginId || "").trim().toUpperCase() !== ADMIN_LOGIN_ID) {
    throw new Error("Unknown admin ID.");
  }
  const { data, error } = await sb.auth.signInWithPassword({
    email: ADMIN_AUTH_EMAIL,
    password: password
  });
  if (error) throw new Error(error.message || "Sign-in failed.");
  currentAdminSession = data.session;
  return currentAdminSession;
}

async function adminLogout() {
  await sb.auth.signOut();
  currentAdminSession = null;
}

function refreshAdminBar() {
  const status = document.getElementById("adminStatus");
  const loggedInBar = document.getElementById("adminLoggedInBar");
  const toggleWrap = document.getElementById("adminLoginToggleWrap");
  const loginForm = document.getElementById("adminLoginForm");
  if (!status) return;
  if (isAdmin()) {
    status.textContent = "Signed in as admin — edit enabled";
    loggedInBar.style.display = "inline";
    toggleWrap.style.display = "none";
    loginForm.style.display = "none";
  } else {
    status.textContent = "Signed out — viewing as everyone else";
    loggedInBar.style.display = "none";
    toggleWrap.style.display = "inline";
  }
}

const $ = id => document.getElementById(id);
const startDateEl=$('startDate'), sbuEl=$('sbu'),
      projectNameList=$('projectNameList'), addNameBtn=$('addNameBtn'),
      addBtn=$('addBtn'), msg=$('msg'), tableBody=$('tableBody'), emptyMsg=$('emptyMsg');
const fSbu=$('fSbu'), fStatus=$('fStatus'), fFrom=$('fFrom'), fTo=$('fTo'),
      applyFilterBtn=$('applyFilter'), resetFilterBtn=$('resetFilter');
const trackerMonth=$('trackerMonth'), trackerCount=$('trackerCount'),
      trackerBar=$('trackerBar'), trackerNote=$('trackerNote');

function showMessage(text, type='ok'){
  msg.textContent = text;
  msg.className = 'msg show ' + type;
  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(()=> msg.classList.remove('show'), type==='error' ? 4000 : 2500);
}

function addNameRow(){
  const row = document.createElement('div');
  row.className = 'name-row';
  row.innerHTML = `<input type="text" class="project-name-input" placeholder="e.g. SOP of VRM">
    <button type="button" class="remove-name-btn" title="Remove">&times;</button>`;
  row.querySelector('.remove-name-btn').addEventListener('click', ()=>{
    if(projectNameList.children.length > 1){
      row.remove();
    } else {
      row.querySelector('input').value = '';
    }
  });
  projectNameList.appendChild(row);
}
addNameRow(); // start with one row
addNameBtn.addEventListener('click', addNameRow);

const SBU_OPTIONS = ["ACCL","AIL","AAFL","AEL(Flour)","APFIL","HRML","MRML","FAL"];
fSbu.innerHTML = '<option value="">All</option>' + SBU_OPTIONS.map(s=>`<option>${s}</option>`).join('');

function statusClass(status){
  if(status === 'Completed') return 'completed';
  if(status === 'In Progress') return 'in-progress';
  return 'not-started';
}

function monthKey(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-US',{month:'long', year:'numeric'});
}

function populateMonthOptions(){
  const now = new Date();
  const opts = [];
  for(let i=0;i<12;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    opts.push({key, label: monthLabel(key)});
  }
  trackerMonth.innerHTML = opts.map(o=>`<option value="${o.key}">${o.label}</option>`).join('');
}
populateMonthOptions();

async function refreshTracker(){
  const key = trackerMonth.value;
  const [y,m] = key.split('-').map(Number);
  const from = `${key}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const to = `${key}-${String(lastDay).padStart(2,'0')}`;

  const { data, error } = await sb.from(TABLE).select('status').gte('start_date', from).lte('start_date', to);
  if(error){ trackerNote.textContent = 'Could not load: ' + error.message; return; }

  const completed = data.filter(r => r.status === 'Completed').length;
  trackerCount.textContent = `${completed} / ${MONTHLY_TARGET}`;
  const pct = Math.min(100, Math.round((completed / MONTHLY_TARGET) * 100));
  trackerBar.style.width = pct + '%';
  trackerBar.classList.toggle('behind', completed < MONTHLY_TARGET);
  trackerNote.textContent = completed >= MONTHLY_TARGET
    ? `Target met for ${monthLabel(key)}.`
    : `${MONTHLY_TARGET - completed} more project(s) needed to hit target for ${monthLabel(key)}.`;
}
trackerMonth.addEventListener('change', refreshTracker);

function buildRow(r){
  const tr = document.createElement('tr');
  tr.dataset.id = r.id;

  const summaryCell = r.is_finalized && r.summary
    ? `<span class="summary-cell">${r.summary}</span>`
    : `<span class="summary-cell" style="color:#c3c8d1;">—</span>`;

  const finalizeBtnLabel = r.is_finalized ? 'Finalized' : 'Finalize';

  const statusCell = isAdmin()
    ? `<select class="status-select">
        <option value="Not Started" ${r.status==='Not Started'?'selected':''}>Not started</option>
        <option value="In Progress" ${r.status==='In Progress'?'selected':''}>In progress</option>
        <option value="Completed" ${r.status==='Completed'?'selected':''}>Completed</option>
      </select>`
    : `<span class="pill ${statusClass(r.status)}">${r.status}</span>`;

  const actionsCell = isAdmin()
    ? `<div class="row-actions">
        <button type="button" class="fin-btn-sm btn-finalize ${r.is_finalized?'active':''}">${finalizeBtnLabel}</button>
        <button type="button" class="del-btn">Delete</button>
      </div>`
    : (r.is_finalized ? `<span class="pill final">Final</span>` : '');

  tr.innerHTML = `
    <td>${r.start_date || '—'}</td>
    <td>${r.sbu}</td>
    <td>${r.project_name}</td>
    <td>${statusCell}</td>
    <td>${summaryCell}</td>
    <td>${actionsCell}</td>`;

  if (!isAdmin()) return tr;

  // status change -> update db
  tr.querySelector('.status-select').addEventListener('change', async (e)=>{
    const newStatus = e.target.value;
    const { error } = await sb.from(TABLE).update({status:newStatus}).eq('id', r.id);
    if(error){ showMessage('Could not update status: ' + error.message, 'error'); return; }
    r.status = newStatus;
    refreshTracker();
  });

  // finalize -> reveal inline textarea to capture summary, save on blur/enter
  tr.querySelector('.fin-btn-sm').addEventListener('click', ()=>{
    if(tr.querySelector('.inline-summary-row')) return; // already open
    const box = document.createElement('tr');
    box.className = 'inline-summary-row';
    box.innerHTML = `<td colspan="6">
        <div class="summary-box show">
          <label style="font-size:11.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px;">
            Project summary
          </label>
          <textarea placeholder="Summarize what was done, outcome, and any follow-up...">${r.summary || ''}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button type="button" class="save-summary-btn" style="padding:8px 16px;">Save summary & finalize</button>
            <button type="button" class="cancel-summary-btn btn-secondary" style="padding:8px 16px;">Cancel</button>
          </div>
        </div>
      </td>`;
    tr.after(box);

    box.querySelector('.cancel-summary-btn').addEventListener('click', ()=> box.remove());
    box.querySelector('.save-summary-btn').addEventListener('click', async ()=>{
      const summaryText = box.querySelector('textarea').value.trim();
      if(!summaryText){ showMessage('Write a summary before finalizing.', 'error'); return; }
      const { error } = await sb.from(TABLE).update({ is_finalized:true, summary:summaryText }).eq('id', r.id);
      if(error){ showMessage('Could not save summary: ' + error.message, 'error'); return; }
      r.is_finalized = true;
      r.summary = summaryText;
      box.remove();
      loadEntries();
    });
  });

  tr.querySelector('.del-btn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.dataset.confirming !== 'yes'){
      btn.dataset.confirming = 'yes';
      btn.textContent = 'Click again to confirm';
      setTimeout(()=>{ btn.dataset.confirming=''; btn.textContent='Delete'; }, 3000);
      return;
    }
    btn.textContent = 'Deleting…';
    const { error } = await sb.from(TABLE).delete().eq('id', r.id);
    if(error){ showMessage('Could not delete: ' + error.message, 'error'); btn.textContent='Delete'; btn.dataset.confirming=''; return; }
    tr.remove();
    if(!tableBody.children.length) emptyMsg.style.display='block';
    refreshTracker();
  });

  return tr;
}

async function loadEntries(){
  let query = sb.from(TABLE).select('*').order('start_date', {ascending:false});

  if(fSbu.value) query = query.eq('sbu', fSbu.value);
  if(fStatus.value) query = query.eq('status', fStatus.value);
  if(fFrom.value) query = query.gte('start_date', fFrom.value);
  if(fTo.value) query = query.lte('start_date', fTo.value);

  const { data, error } = await query;
  if(error){ showMessage('Could not load entries: ' + error.message, 'error'); return; }

  tableBody.innerHTML = '';
  if(!data.length){ emptyMsg.style.display='block'; return; }
  emptyMsg.style.display='none';
  data.forEach(r => tableBody.appendChild(buildRow(r)));
}

addBtn.addEventListener('click', async ()=>{
  const names = [...projectNameList.querySelectorAll('.project-name-input')]
    .map(i => i.value.trim())
    .filter(v => v.length > 0);

  if(!startDateEl.value || !sbuEl.value || names.length === 0){
    showMessage('Fill in start date, SBU, and at least one project name.', 'error');
    return;
  }

  addBtn.disabled = true;
  addBtn.textContent = 'Saving…';

  try{
    const rows = names.map(name => ({
      start_date: startDateEl.value,
      sbu: sbuEl.value,
      project_name: name,
      status: 'Not Started',
      is_finalized: false
    }));

    const { data, error } = await sb.from(TABLE).insert(rows).select();

    if(error){
      showMessage('Could not save: ' + error.message, 'error');
      return;
    }

    showMessage(`${data.length} project${data.length>1?'s':''} added below.`, 'ok');

    // reset form
    projectNameList.innerHTML = '';
    addNameRow();
    sbuEl.value = '';
    startDateEl.value = '';

    await loadEntries();
    await refreshTracker();
  } catch(err){
    showMessage('Unexpected error: ' + err.message, 'error');
    console.error(err);
  } finally{
    addBtn.disabled = false;
    addBtn.textContent = 'Add project';
  }
});

applyFilterBtn.addEventListener('click', (e)=>{ e.preventDefault(); loadEntries(); });
resetFilterBtn.addEventListener('click', ()=>{
  fSbu.value=''; fStatus.value=''; fFrom.value=''; fTo.value='';
  loadEntries();
});

document.getElementById("adminLoginToggleBtn").addEventListener("click", () => {
  const form = document.getElementById("adminLoginForm");
  form.style.display = form.style.display === "none" ? "flex" : "none";
  form.style.flexDirection = "column";
});

document.getElementById("adminLogoutBtn").addEventListener("click", async () => {
  await adminLogout();
  refreshAdminBar();
  loadEntries();
});

document.getElementById("adminLoginSubmitBtn").addEventListener("click", async () => {
  const loginId = document.getElementById("adminIdInput").value;
  const password = document.getElementById("adminPasswordInput").value;
  const errEl = document.getElementById("adminLoginError");
  const btn = document.getElementById("adminLoginSubmitBtn");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";

  }
});
