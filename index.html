      <div class="filters" id="filters">
        <div class="filter-pill active" data-filter="all">All</div>
        <div class="filter-pill" data-filter="Created">Created</div>
        <div class="filter-pill" data-filter="Complete">Complete</div>
        <select id="typeFilter" class="filter-pill" style="cursor:pointer;">
          <option value="all">All Types</option>
          <option value="Offline">Offline</option>
          <option value="Online">Online</option>
        </select>
        <select id="sbuFilter" class="filter-pill" style="cursor:pointer;">
          <option value="all">All SBUs</option>
          <option value="ACCL">ACCL</option>
          <option value="APFIL">APFIL</option>
          <option value="FAL">FAL</option>
          <option value="MRML">MRML</option>
          <option value="M.OIL">M.OIL</option>
          <option value="AEFML">AEFML</option>
          <option value="AAFL">AAFL</option>
          <option value="ALEL">ALEL</option>
          <option value="AIL">AIL</option>
        </select>
      </div>

      <div class="cards-list" id="cardsList"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1zZ68nxCL0XK0gPQDG5fsg_CqWCCBEU";
const TABLE = "accl_training_provided";

let entries = [];
let activeFilter = "all";
let activeTypeFilter = "all";
let activeSbuFilter = "all";
let highestTrainingNum = 0;

function apiHeaders(extra) {
  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}

// --- Admin auth --------------------------------------------------------
// Deleting training entries is enforced at the database level (RLS): only
// a signed-in session for this admin account is allowed to DELETE from
// accl_training_provided. The anon key alone cannot delete anymore.
const ADMIN_LOGIN_ID = "OPEX";
const ADMIN_AUTH_EMAIL = "opex@command-center.internal"; // internal auth identifier, not a real mailbox
const ADMIN_SESSION_KEY = "training_admin_session_v1";

let adminSession = loadAdminSession();

function loadAdminSession() {
  try {
    const raw = localStorage.getItem(ADMIN_SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.access_token || !parsed.expires_at || parsed.expires_at <= Date.now()) {
      localStorage.removeItem(ADMIN_SESSION_KEY);
      return null;
    }
    return parsed;
  } catch (e) {
    return null;
  }
}

function isAdmin() {
  return !!(adminSession && adminSession.expires_at > Date.now());
}

async function adminLogin(loginId, password) {
  if ((loginId || "").trim().toUpperCase() !== ADMIN_LOGIN_ID) {
    throw new Error("Unknown admin ID.");
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: ADMIN_AUTH_EMAIL, password: password })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) {
    throw new Error(data.error_description || data.msg || "Sign-in failed.");
  }
  adminSession = {
    access_token: data.access_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000
  };
  localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(adminSession));
  return adminSession;
}

function adminLogout() {
  adminSession = null;
  localStorage.removeItem(ADMIN_SESSION_KEY);
}

function refreshAdminBar() {
  const status = document.getElementById("adminStatus");
  const loggedInBar = document.getElementById("adminLoggedInBar");
  const toggleWrap = document.getElementById("adminLoginToggleWrap");
  const loginForm = document.getElementById("adminLoginForm");
  if (isAdmin()) {
    status.textContent = "Signed in as admin — delete enabled";
    loggedInBar.style.display = "inline";
    toggleWrap.style.display = "none";
    loginForm.style.display = "none";
  } else {
    status.textContent = "Signed out — viewing as everyone else";
    loggedInBar.style.display = "none";
    toggleWrap.style.display = "inline";
  }
}

// --- Role gate (Continue as Viewer / Continue as Admin) ---------------
const ROLE_KEY = "training_role_choice_v1";

function showGate() {
  document.getElementById("gateChoiceButtons").style.display = "flex";
  document.getElementById("gateLoginForm").style.display = "none";
  document.getElementById("gateAdminError").textContent = "";
  document.getElementById("gateAdminId").value = "";
  document.getElementById("gateAdminPassword").value = "";
  document.getElementById("roleGate").style.display = "flex";
}
function hideGate() {
  document.getElementById("roleGate").style.display = "none";
}
function decideGate() {
  if (isAdmin() || localStorage.getItem(ROLE_KEY) === "viewer") {
    hideGate();
  } else {
    showGate();
  }
}

function fromDbRow(row) {
  return {
    dbId: row.id,
    trainingNo: "TRN-" + String(row.id).padStart(3, "0"),
    sbu: row.sbu,
    type: row.training_type,
    name: row.training_name,
    trainees: row.no_of_trainees,
    duration: row.training_duration_min,
    manhours: row.total_manhour_training,
    status: row.status,
    date: row.created_at ? row.created_at.slice(0, 10) : "",
    completionDate: row.completion_date
  };
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}`;
}

function todayISO() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function loadEntries() {
  const statusEl = document.getElementById("statusMsg");
  if (statusEl) statusEl.textContent = "Loading...";
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc`,
      { headers: apiHeaders() }
    );
    if (!res.ok) throw new Error("Fetch failed: " + res.status);
    const rows = await res.json();
    entries = rows.map(fromDbRow);
    highestTrainingNum = entries.reduce((max, e) => Math.max(max, e.dbId), 0);
    if (statusEl) statusEl.textContent = "";
  } catch (err) {
    console.error(err);
    if (statusEl) statusEl.textContent = "Could not load from Supabase";
    entries = [];
  }
}

async function insertEntry(entry) {
  const payload = {
    sbu: entry.sbu,
    training_type: entry.type,
    training_name: entry.name,
    no_of_trainees: Number(entry.trainees),
    training_duration_min: Number(entry.duration),
    status: "Created"
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method: "POST",
    headers: apiHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("Insert failed: " + res.status + " " + text);
  }
  return res.json();
}

async function markComplete(dbId, completionDate) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${dbId}`, {
    method: "PATCH",
    headers: apiHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify({ status: "Complete", completion_date: completionDate })
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("Update failed: " + res.status + " " + text);
  }
  return res.json();
}

async function deleteEntry(dbId) {
  if (!isAdmin()) throw new Error("Admin sign-in required to delete.");
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${dbId}`, {
    method: "DELETE",
    headers: apiHeaders({ "Authorization": "Bearer " + adminSession.access_token })
  });
  if (!res.ok) throw new Error("Delete failed: " + res.status);
}

function nextTrainingNo() {
  return "TRN-" + String(highestTrainingNum + 1).padStart(3, "0");
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function refreshFormDefaults() {
  document.getElementById("trainingNo").value = nextTrainingNo();
  document.getElementById("dateDisplay").value = fmtDate(todayISO());
}

function updateManhourPreview() {
  const trainees = Number(document.getElementById("noOfTrainees").value) || 0;
  const duration = Number(document.getElementById("durationMin").value) || 0;
  const manhours = Math.round(((trainees * duration) / 60) * 10000) / 10000;
  document.getElementById("manhourPreview").textContent = manhours;
}

function updateStats() {
  const total = entries.length;
  const created = entries.filter(e => e.status === "Created").length;
  const complete = entries.filter(e => e.status === "Complete").length;
  const manhours = entries.reduce((sum, e) => sum + (Number(e.manhours) || 0), 0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statCreated").textContent = created;
  document.getElementById("statComplete").textContent = complete;
  document.getElementById("statManhours").textContent = Math.round(manhours * 100) / 100;
}

function renderCards() {
  const list = document.getElementById("cardsList");
  const filtered = entries.filter(e => {
    if (activeTypeFilter !== "all" && e.type !== activeTypeFilter) return false;
    if (activeSbuFilter !== "all" && (e.sbu || "") !== activeSbuFilter) return false;
    if (activeFilter === "all") return true;
    return e.status === activeFilter;
  });

  updateStats();

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No trainings in this view yet.</div>`;
    return;
  }

  list.innerHTML = filtered.slice().reverse().map(e => {
    const statusClass = e.status === "Complete" ? "status-complete" : "status-created";
    const isComplete = e.status === "Complete";
    return `
      <div class="card">
        <div class="card-top">
          <div class="card-id-group">
            <span class="card-id">${escapeHtml(e.trainingNo)}</span>
            <span class="status-chip ${statusClass}">${escapeHtml(e.status)}</span>
          </div>
          <span class="card-meta">Logged ${escapeHtml(fmtDate(e.date))}</span>
        </div>
        <div class="card-name">${escapeHtml(e.name)}</div>
        <div class="tag-row">
          <span class="tag">${escapeHtml(e.sbu || "—")}</span>
          <span class="tag">${escapeHtml(e.type || "—")}</span>
        </div>
        <div class="metric-grid">
          <div class="metric-item"><span class="k">No of Trainees</span><span class="v">${e.trainees ?? "—"}</span></div>
          <div class="metric-item"><span class="k">Duration (min)</span><span class="v">${e.duration ?? "—"}</span></div>
          <div class="metric-item"><span class="k">Man-hour Training</span><span class="v">${e.manhours ?? "—"}</span></div>
        </div>
        <div class="card-footer">
          ${isComplete
            ? `<span class="completed-note">Completed on ${escapeHtml(fmtDate(e.completionDate))}</span>`
            : `<div class="complete-controls">
                 <input type="date" data-id="${e.dbId}" class="completion-date-input" value="${todayISO()}">
                 <button class="complete-btn" data-id="${e.dbId}">Complete</button>
               </div>`
          }
          ${isAdmin() ? `<button class="del-link" data-id="${e.dbId}">Delete</button>` : ""}
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".complete-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const dbId = Number(btn.getAttribute("data-id"));
      const dateInput = list.querySelector(`.completion-date-input[data-id="${dbId}"]`);
      const completionDate = dateInput ? dateInput.value : todayISO();
      if (!completionDate) {
        alert("Please choose a completion date.");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const updated = await markComplete(dbId, completionDate);
        const row = Array.isArray(updated) ? updated[0] : updated;
        const idx = entries.findIndex(e => e.dbId === dbId);
        if (idx !== -1) entries[idx] = fromDbRow(row);
        renderCards();
      } catch (err) {
        console.error(err);
        alert("Could not mark this training complete. Please try again.");
        btn.disabled = false;
        btn.textContent = "Complete";
      }
    });
  });

  list.querySelectorAll(".del-link").forEach(btn => {
    btn.addEventListener("click", async () => {
      const dbId = Number(btn.getAttribute("data-id"));
      btn.disabled = true;
      btn.textContent = "Deleting...";
      try {
        await deleteEntry(dbId);
        entries = entries.filter(e => e.dbId !== dbId);
        renderCards();
      } catch (err) {
        console.error(err);
        alert("Could not delete this entry. Please try again.");
        btn.disabled = false;
        btn.textContent = "Delete";
      }
    });
  });
}

document.querySelectorAll(".filter-pill[data-filter]").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".filter-pill[data-filter]").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    activeFilter = pill.getAttribute("data-filter");
    renderCards();
  });
});

document.getElementById("typeFilter").addEventListener("change", (e) => {
  activeTypeFilter = e.target.value;
  renderCards();
});

document.getElementById("sbuFilter").addEventListener("change", (e) => {
  activeSbuFilter = e.target.value;
  renderCards();
});

document.getElementById("noOfTrainees").addEventListener("input", updateManhourPreview);

document.getElementById("adminLoginToggleBtn").addEventListener("click", () => {
  const form = document.getElementById("adminLoginForm");
  form.style.display = form.style.display === "none" ? "flex" : "none";
  document.getElementById("adminLoginForm").style.flexDirection = "column";
});

document.getElementById("adminLogoutBtn").addEventListener("click", () => {
  adminLogout();
  localStorage.removeItem(ROLE_KEY);
  refreshAdminBar();
  renderCards();
  showGate();
});

document.getElementById("adminLoginSubmitBtn").addEventListener("click", async () => {
  const loginId = document.getElementById("adminIdInput").value;
  const password = document.getElementById("adminPasswordInput").value;
  const errEl = document.getElementById("adminLoginError");
  const btn = document.getElementById("adminLoginSubmitBtn");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    await adminLogin(loginId, password);
    document.getElementById("adminIdInput").value = "";
    document.getElementById("adminPasswordInput").value = "";
    refreshAdminBar();
    renderCards();
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

document.getElementById("gateViewerBtn").addEventListener("click", () => {
  localStorage.setItem(ROLE_KEY, "viewer");
  hideGate();
});

document.getElementById("gateAdminBtn").addEventListener("click", () => {
  document.getElementById("gateChoiceButtons").style.display = "none";
  document.getElementById("gateLoginForm").style.display = "flex";
});

document.getElementById("gateBackBtn").addEventListener("click", () => {
  document.getElementById("gateChoiceButtons").style.display = "flex";
  document.getElementById("gateLoginForm").style.display = "none";
});

document.getElementById("gateAdminSubmit").addEventListener("click", async () => {
  const loginId = document.getElementById("gateAdminId").value;
  const password = document.getElementById("gateAdminPassword").value;
  const errEl = document.getElementById("gateAdminError");
  const btn = document.getElementById("gateAdminSubmit");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    await adminLogin(loginId, password);
    localStorage.removeItem(ROLE_KEY);
    refreshAdminBar();
    renderCards();
    hideGate();
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});
document.getElementById("durationMin").addEventListener("input", updateManhourPreview);

document.getElementById("submitBtn").addEventListener("click", async () => {
  const sbu = document.getElementById("sbuSelect").value;
  const type = document.getElementById("trainingType").value;
  const name = document.getElementById("trainingName").value.trim();
  const trainees = document.getElementById("noOfTrainees").value;
  const duration = document.getElementById("durationMin").value;

  if (!sbu || !type || !name || trainees === "" || duration === "") {
    alert("Please fill all required fields (marked *) before logging the training.");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Logging...";

  try {
    const inserted = await insertEntry({ sbu, type, name, trainees, duration });
    const row = Array.isArray(inserted) ? inserted[0] : inserted;
    entries.push(fromDbRow(row));
    highestTrainingNum = Math.max(highestTrainingNum, row.id);

    document.getElementById("sbuSelect").value = "";
    document.getElementById("trainingType").value = "";
    document.getElementById("trainingName").value = "";
    document.getElementById("noOfTrainees").value = "";
    document.getElementById("durationMin").value = "";
    updateManhourPreview();
    refreshFormDefaults();
    renderCards();
  } catch (err) {
    console.error(err);
    alert("Could not save this training to Supabase. Please check your connection and try again.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Log Training";
  }
});

(async function init() {
  refreshAdminBar();
  decideGate();
  await loadEntries();
  refreshFormDefaults();
  updateManhourPreview();
  renderCards();
})();

<body>
<div id="roleGate" style="position:fixed;inset:0;z-index:9999;background:rgba(17,24,39,0.85);display:flex;align-items:center;justify-content:center;padding:20px;">

      </div>
      <span id="gateAdminError" style="color:#dc2626;font-size:13px;"></span>
    </div>
  </div>
</div>
<div class="card">
  <h1>SBU KPI Monthly Target Entry Sheet</h1>
  <p class="sub">Select SBU, KPI, and Month. Label and unit fill in automatically — enter the target manually.</p>

  <div class="row">
    <div>
      <label for="sbu">SBU</label>
      <select id="sbu">
        <option value="">-- Select SBU --</option>
      </select>
    </div>

      <label for="kpiId">KPI ID</label>
      <select id="kpiId">
        <option value="">-- Select KPI --</option>
      </select>

  </div>

  <div class="row">
    <div>
      <label for="kpiLabel">KPI Label (auto)</label>
      <input type="text" id="kpiLabel" readonly>
    </div>

  <div class="row">
    <div>
      <label for="month">Month</label>
      <select id="month">
        <option value="">-- Select Month --</option>
      </select>
    </div>
    <div>
      <label for="target">Monthly Target (manual)</label>
      <input type="text" id="target" placeholder="e.g. 159,000">

  </div>

  <div class="actions">

<script>

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwd2JjdXh3eGtxdmF1ZmZxb29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjA4NjEsImV4cCI6MjA5OTM5Njg2MX0.iAoIZXl-2G7h3wm4jcYsEs6-wdN-YKTS-KbBteBBzUk";

// --- Role gate (Continue as Viewer / Continue as Admin) ---------------
const ROLE_KEY = "kpi_role_choice_v1";

function showGate() {

const sbuList = ["ACCL","AIL","AEFML","M.OIL","MRML","FAL","APFIL","ALEL","AAFL"];

const kpiMap = {
  "prod_budget":     { label: "Production Budget", unit: "BDT" },
  "cap_util":        { label: "Capacity Utilization", unit: "%" },
  "oee":             { label: "OEE", unit: "%" },
  "manpower":        { label: "Manpower", unit: "hd" },
  "ot":              { label: "OT", unit: "HR" },
  "kaizen":          { label: "Kaizen", unit: "no." },
  "qcp_audit":       { label: "QCP Audit", unit: "no." },
  "5s_score":        { label: "5S Score", unit: "%" },
  "training":        { label: "Training", unit: "no." },
  "project":         { label: "Project", unit: "no." },
  "kaizen_savings":  { label: "Kaizen Savings", unit: "BDT" },
  "OT cost":         { label: "OT Amount", unit: "BDT" }
};

const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const sbuSel = document.getElementById('sbu');
const kpiSel = document.getElementById('kpiId');
const labelInput = document.getElementById('kpiLabel');

const targetInput = document.getElementById('target');

const emptyRow = document.getElementById('emptyRow');

sbuList.forEach(s => {
  const o = document.createElement('option');
  o.value = s; o.textContent = s;
  sbuSel.appendChild(o);
});

Object.keys(kpiMap).forEach(k => {
  const o = document.createElement('option');
  o.value = k; o.textContent = k;
  kpiSel.appendChild(o);
});

months.forEach(m => {
  const o = document.createElement('option');
  o.value = m; o.textContent = m;
  monthSel.appendChild(o);
});

kpiSel.addEventListener('change', () => {
  const data = kpiMap[kpiSel.value];
  if (data) {
    labelInput.value = data.label;
    unitInput.value = data.unit;
  } else {
    labelInput.value = '';
    unitInput.value = '';
  }
});

let entries = [];
const addBtn = document.getElementById('addBtn');

async function loadEntries() {
  const { data, error } = await supabaseClient
    .from('ACCL_KPI_TARGET')
    .select('id, sbu, kpi_id, kpi_label, unit, month, monthly_target')
    .order('id', { ascending: true });
  if (error) {
    console.error(error);
    return;
  }
  entries = data.map(r => ({
    dbId: r.id,
    sbu: r.sbu,
    kpiId: r.kpi_id,
    kpiLabel: r.kpi_label,
    unit: r.unit,
    month: r.month,
    target: r.monthly_target
  }));
  renderTable();
}

addBtn.addEventListener('click', async () => {
  if (!sbuSel.value || !kpiSel.value || !monthSel.value || !targetInput.value.trim()) {
    alert('Please fill in SBU, KPI ID, Month, and Monthly Target.');
    return;
  }
  addBtn.disabled = true;
  addBtn.textContent = 'Saving...';

  const { data, error } = await supabaseClient
    .from('ACCL_KPI_TARGET')
    .upsert({
      sbu: sbuSel.value,
      kpi_id: kpiSel.value,
      kpi_label: labelInput.value,
      unit: unitInput.value,
      month: monthSel.value,
      monthly_target: targetInput.value.trim()
    }, { onConflict: 'sbu,kpi_id,month' })
    .select();

  addBtn.disabled = false;
  addBtn.textContent = 'Add Entry';

  if (error) {
    alert('Error saving to Supabase: ' + error.message);
    return;
  }

  await loadEntries();

  kpiSel.value = '';
  labelInput.value = '';
  unitInput.value = '';
  targetInput.value = '';
});

    document.getElementById("adminPasswordInput").value = "";

    btn.disabled = false;
    btn.textContent = "Sign in";

});

document.getElementById("gateAdminSubmit").addEventListener("click", async () => {

});

  currentAdminSession = data.session || null;
  refreshAdminBar();
  decideGate();
  renderTable();
})();

loadEntries();

function renderTable() {
  tbody.innerHTML = '';
  if (entries.length === 0) {
    tbody.appendChild(emptyRow);
    return;
  }
  entries.forEach((e, i) => {
    if (e.hidden) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.sbu}</td><td>${e.kpiId}</td><td>${e.kpiLabel}</td><td>${e.unit}</td><td>${e.month}</td><td>${e.target}</td>
      <td><button data-i="${i}" class="hideRowBtn" style="background:#6b7280;padding:4px 8px;font-size:12px;margin:0;width:auto;">Hide</button></td>
      ${isAdmin() ? `<td><button data-i="${i}" class="deleteRowBtn" style="background:#dc2626;padding:4px 8px;font-size:12px;margin:0;width:auto;">Delete</button></td>` : '<td></td>'}`;
    tbody.appendChild(tr);
  });
  if (tbody.children.length === 0) {
    tbody.appendChild(emptyRow);
  }
  tbody.querySelectorAll('.deleteRowBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!isAdmin()) { alert('Admin sign-in required to delete.'); return; }
      const idx = Number(btn.dataset.i);
      const entry = entries[idx];
      btn.disabled = true;
      btn.textContent = '...';
      if (entry.dbId) {
        const { error } = await supabaseClient
          .from('ACCL_KPI_TARGET')
          .delete()
          .eq('id', entry.dbId);
        if (error) {
          alert('Error deleting from Supabase: ' + error.message);
          btn.disabled = false;
          btn.textContent = 'Delete';
          return;
        }
      }
      entries.splice(idx, 1);
      renderTable();
    });
  });
  tbody.querySelectorAll('.hideRowBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      entries[Number(btn.dataset.i)].hidden = true;
      renderTable();
    });
  });
}

    function fillSpecs() {
        const sbu = document.getElementById('sbuSelect').value;
        const item = document.getElementById('itemInput').value;
        const test = document.getElementById('testInput').value;
        const row = masterData.find(r => r[0] === sbu && r[3] === item && r[4] === test);
        if (row) {
            document.getElementById('minVal').value = row[5];
            document.getElementById('maxVal').value = row[6];
            calculateStatus();
        }
    }

    function calculateStatus() {
        const actualRaw = document.getElementById('actualVal').value.trim();
        const minRaw = document.getElementById('minVal').value.trim();
        const maxRaw = document.getElementById('maxVal').value.trim();
        const status = document.getElementById('status');

        if (!actualRaw || !minRaw || !maxRaw) {
            status.value = "";
            status.className = "";
            return;
        }

        const actualNum = parseFloat(actualRaw);
        const minNum = parseFloat(minRaw);
        const maxNum = parseFloat(maxRaw);

        let isPass;
        if (!isNaN(actualNum) && !isNaN(minNum) && !isNaN(maxNum)) {
            isPass = actualNum >= minNum && actualNum <= maxNum;
        } else {
            const a = actualRaw.toLowerCase();
            isPass = a === minRaw.toLowerCase() || a === maxRaw.toLowerCase();
        }
        status.value = isPass ? "Pass" : "Fail";
        status.className = isPass ? "pass" : "fail";
    }

    function resetSpecs() {
        document.getElementById('minVal').value = "";
        document.getElementById('maxVal').value = "";
        document.getElementById('status').value = "";
        document.getElementById('status').className = "";
    }

        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        let auditMonth = "";
        if (dateVal) {

            auditMonth = monthNames[d.getMonth()] + "-" + d.getFullYear();

            sbu: sbuVal || null,

            machine_name: machineVal || null,

            status: statusVal || null,
            wss: wssVal || null,
            remarks: remarksVal || null,
            audit_month: auditMonth || null
        });

        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Audit';

        if (error) {
            alert('Error saving to Supabase: ' + error.message);
            return;

        document.getElementById('testList').innerHTML = '';

        setTimeout(() => { document.getElementById('successMsg').style.display = 'none'; }, 5000);

        await loadEntries();
    });

    // --- Entries list (view) -------------------------------------------------
    let entries = [];

    async function loadEntries() {
        const sbu = document.getElementById('filterSbu').value;
        const section = document.getElementById('filterSection').value;
        const machine = document.getElementById('filterMachine').value;
        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;

        let query = supabaseClient
            .from('accl_qcp_audit')
            .select('id, audit_date, sbu, section, machine_name, product_criteria, test_name, actual_value, status')
            .order('id', { ascending: false })
            .limit(200);

        if (sbu) query = query.eq('sbu', sbu);
        if (section) query = query.eq('section', section);
        if (machine) query = query.eq('machine_name', machine);
        if (from) query = query.gte('audit_date', from);
        if (to) query = query.lte('audit_date', to);

        const { data, error } = await query;
        if (error) {
            console.error(error);
            return;
        }
        entries = data || [];
        renderEntries();
    }

            const statusBg = e.status === 'Pass' ? '#d4edda' : (e.status === 'Fail' ? '#f8d7da' : 'transparent');
            tr.innerHTML = `
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.audit_date || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.sbu || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.section || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.machine_name || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.product_criteria || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.test_name || ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${e.actual_value ?? ''}</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;"><span style="background:${statusBg};color:${statusColor};padding:2px 8px;border-radius:4px;font-weight:bold;">${e.status || ''}</span></td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;">${isAdmin() ? `<button type="button" class="deleteRowBtn" data-id="${e.id}" style="background:#dc2626;padding:4px 8px;font-size:12px;margin:0;width:auto;">Delete</button>` : ''}</td>
            `;
            tbody.appendChild(tr);
        });
        tbody.querySelectorAll('.deleteRowBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!isAdmin()) { alert('Admin sign-in required to delete.'); return; }
                const id = btn.dataset.id;
                btn.disabled = true;
                btn.textContent = '...';
                const { error } = await supabaseClient.from('accl_qcp_audit').delete().eq('id', id);
                if (error) {
                    alert('Error deleting from Supabase: ' + error.message);
                    btn.disabled = false;
                    btn.textContent = 'Delete';
                    return;
                }
                await loadEntries();
            });
        });
    }

    initDropdowns();

    (async function initAdmin() {
        const { data } = await supabaseClient.auth.getSession();
        currentAdminSession = data.session || null;
        refreshAdminBar();
        decideGate();
        await loadEntries();
    })();
%%ENDSCRIPT%%>
</body>
</html>
</script>

<script type="text/plain" id="tpl-task-assigner"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Order — Task Assigner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">%%ENDSCRIPT%%>
<style>
  :root{
    --bg:#F2F3F6;
    --surface:#FFFFFF;
    --ink:#1C2230;
    --ink-soft:#636C80;
    --ink-faint:#9AA1B2;
    --primary:#1E3A5F;
    --primary-ink:#EAF0F8;
    --accent:#E2932F;
    --danger:#C1443D;
    --success:#2F8F5B;
    --info:#3B6FA0;
    --border:#E1E4EA;
    --border-strong:#C7CCD8;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,34,48,.06), 0 8px 24px -12px rgba(28,34,48,.18);
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(30,58,95,.03), rgba(30,58,95,0) 220px),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(226,147,47,.28);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .auth-note a{color:var(--info);font-weight:600;text-decoration:underline;cursor:pointer;}
  a{color:inherit;}

  /* ---------- utility ---------- */
  .hidden{display:none !important;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2.5px solid var(--accent); outline-offset:2px;
  }

  /* ---------- login screen ---------- */
  #auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .badge-card{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border-radius:14px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .badge-header{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px),
      linear-gradient(135deg, var(--primary), #16283F);
    color:var(--primary-ink);
    padding:28px 28px 22px;
    position:relative;
  }
  .badge-eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.75;
    display:flex;
    justify-content:space-between;
  }
  .badge-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    line-height:1.05;
    margin:10px 0 2px;
    letter-spacing:.01em;
  }
  .badge-sub{font-size:13px;opacity:.8;margin:0;}
  .badge-punch{
    position:absolute; top:50%; right:-11px; width:22px;height:22px;border-radius:50%;
    background:var(--bg); transform:translateY(-50%);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .badge-body{padding:26px 28px 28px;}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:9px;margin-bottom:20px;}
  .tab-btn{
    flex:1;border:none;background:transparent;padding:9px 0;border-radius:6px;
    font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.02em;
    color:var(--ink-soft);
  }
  .tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:14.5px;color:var(--ink);background:var(--surface);
  }
  .field input:focus, .field select:focus{border-color:var(--primary);}
  .role-pick{display:flex;gap:8px;}
  .role-pick label{
    flex:1;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--border);
    border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink-soft);
    font-weight:500;text-transform:none;letter-spacing:0;
  }
  .role-pick input{width:auto;accent-color:var(--primary);margin-right:6px;}
  .role-pick input:checked + span{color:var(--primary);font-weight:700;}
  .role-pick label:has(input:checked){border-color:var(--primary);background:#F3F7FB;}
  .btn-primary{
    width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;
    padding:12px;font-weight:700;font-size:14.5px;letter-spacing:.02em;margin-top:4px;
    transition:background .15s;
  }
  .btn-primary:hover{background:#16283F;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .auth-note{font-size:12.5px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.5;}
  .auth-error{
    background:#FCEEEC;color:var(--danger);border:1px solid #F3C9C4;border-radius:8px;
    padding:9px 12px;font-size:13px;margin-bottom:14px;
  }
  .auth-success{
    background:#EAF5EF;color:var(--success);border:1px solid #C7E6D3;border-radius:8px;
    padding:9px 12px;font-size:13px;margin-bottom:14px;
  }

  /* ---------- app shell ---------- */
  #app-screen{min-height:100vh;}
  .topbar{
    background:var(--primary);color:var(--primary-ink);padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;height:64px;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:32px;height:32px;border:2px solid var(--accent);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:800;color:var(--accent);font-size:16px;transform:rotate(-3deg);
  }
  .brand-text{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.01em;}
  .brand-text small{display:block;font-family:var(--font-mono);font-size:10px;font-weight:400;
    letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:-2px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .who{text-align:right;font-size:12.5px;line-height:1.35;}
  .who b{font-weight:600;}
  .who span{display:block;color:rgba(234,240,248,.65);font-family:var(--font-mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.1em;}
  .btn-ghost-light{
    background:rgba(255,255,255,.08);color:var(--primary-ink);border:1px solid rgba(255,255,255,.2);
    border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600;
  }
  .btn-ghost-light:hover{background:rgba(255,255,255,.16);}

  .container{max-width:1180px;margin:0 auto;padding:26px 24px 60px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{
    font-family:var(--font-display);font-weight:700;font-size:30px;margin:0 0 2px;color:var(--ink);
  }
  .page-head p{margin:0;color:var(--ink-soft);font-size:14px;}
  .controls-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .select-chip{
    border:1.5px solid var(--border);background:var(--surface);border-radius:7px;padding:8px 10px;
    font-size:13px;color:var(--ink);
  }
  .btn-accent{
    background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;
    font-weight:700;font-size:14px;box-shadow:0 4px 12px -4px rgba(226,147,47,.6);
  }
  .btn-accent:hover{background:#CC7F1F;}

  .empty-state{
    background:var(--surface);border:1.5px dashed var(--border-strong);border-radius:var(--radius);
    padding:40px 24px;text-align:center;color:var(--ink-soft);
  }
  .empty-state h3{font-family:var(--font-display);font-size:20px;color:var(--ink);margin:0 0 4px;}
  .empty-state p{margin:0;font-size:13.5px;}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;align-items:start;}
  @media (max-width:980px){.board{grid-template-columns:1fr 1fr;}}
  @media (max-width:620px){.board{grid-template-columns:1fr;}}
  .col{background:transparent;}
  .col-head{
    display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;
  }
  .col-head h3{
    font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;margin:0;color:var(--ink-soft);display:flex;align-items:center;gap:7px;
  }
  .col-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .col-count{
    font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
    background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;
  }
  .col-body{display:flex;flex-direction:column;gap:10px;min-height:40px;}

  /* ---------- ticket card ---------- */
  .ticket{
    background:var(--surface);border:1px solid var(--border);border-radius:9px;
    box-shadow:var(--shadow);padding:14px 14px 12px;cursor:pointer;position:relative;
    transition:transform .12s, box-shadow .12s;
  }
  .ticket:hover{transform:translateY(-2px);box-shadow:0 4px 14px -6px rgba(28,34,48,.28);}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .ticket-id{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.03em;}
  .prio-tag{
    font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
    font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid;
  }
  .prio-high{color:var(--danger);border-color:#F0BFB9;background:#FCEEEC;}
  .prio-medium{color:var(--accent);border-color:#F3D6A6;background:#FCF3E5;}
  .prio-low{color:var(--info);border-color:#C4D8E9;background:#EDF3FA;}
  .ticket-title{font-weight:600;font-size:14.5px;line-height:1.35;margin:0 0 10px;color:var(--ink);}
  .ticket-meta{
    display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border-strong);
    padding-top:9px;font-size:12px;color:var(--ink-soft);
  }
  .ticket-person{display:flex;align-items:center;gap:6px;overflow:hidden;}
  .avatar{
    width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
    font-family:var(--font-display);
  }
  .ticket-due{font-family:var(--font-mono);font-size:11px;white-space:nowrap;}
  .ticket-due.overdue{color:var(--danger);font-weight:600;}

  /* ---------- list (member view) ---------- */
  .task-list{display:flex;flex-direction:column;gap:10px;}
  .list-row{
    background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .list-row:hover{border-color:var(--border-strong);}
  .stamp{
    font-family:var(--font-display);font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;border:2px solid;border-radius:4px;padding:3px 9px;transform:rotate(-3deg);
    flex:none;white-space:nowrap;
  }
  .stamp-todo{color:var(--ink-soft);border-color:var(--ink-faint);}
  .stamp-in_progress{color:var(--info);border-color:var(--info);}
  .stamp-blocked{color:var(--danger);border-color:var(--danger);}
  .stamp-done{color:var(--success);border-color:var(--success);}
  .list-row-main{flex:1;min-width:0;}
  .list-row-main .ticket-title{margin:0 0 3px;}
  .list-row-sub{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,24,33,.5);display:flex;align-items:flex-start;
    justify-content:center;padding:5vh 20px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--surface);border-radius:14px;max-width:520px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);
  }
  .modal-head h2{font-family:var(--font-display);font-size:21px;margin:0;color:var(--ink);}
  .icon-btn{
    background:transparent;border:none;color:var(--ink-soft);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px;
  }
  .icon-btn:hover{background:var(--bg);}
  .modal-body{padding:20px 22px 22px;}
  .modal-body .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;
    resize:vertical;min-height:80px;color:var(--ink);
  }
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- task detail ---------- */
  .detail-top{margin-bottom:16px;}
  .detail-badges{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .detail-desc{font-size:14px;color:var(--ink);line-height:1.55;margin:0 0 14px;white-space:pre-wrap;}
  .detail-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border-radius:8px;
    padding:12px 14px;margin-bottom:6px;font-size:12.5px;
  }
  .detail-grid div span{display:block;color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;font-family:var(--font-mono);margin-bottom:2px;}
  .status-row{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap;}
  .status-btn{
    border:1.5px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 13px;
    font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .status-btn.current{background:var(--primary);border-color:var(--primary);color:#fff;}
  .updates-feed{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
  .updates-feed h4{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-soft);margin:0 0 12px;
  }
  .update-item{display:flex;gap:10px;margin-bottom:12px;}
  .update-item .avatar{width:26px;height:26px;font-size:11px;margin-top:2px;}
  .update-content{flex:1;background:var(--bg);border-radius:8px;padding:9px 12px;}
  .update-content .u-head{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px;}
  .update-content .u-name{font-weight:700;color:var(--ink);}
  .update-content .u-time{color:var(--ink-faint);font-family:var(--font-mono);font-size:10.5px;}
  .update-content .u-note{font-size:13px;color:var(--ink);line-height:1.45;}
  .update-content .u-status-chip{
    font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--info);margin-top:3px;display:inline-block;
  }
  .update-composer{display:flex;gap:8px;margin-top:14px;}
  .update-composer textarea{
    flex:1;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;
    resize:none;min-height:44px;font-family:inherit;
  }
  .update-composer button{
    background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 16px;font-weight:700;font-size:13px;
  }
  .update-composer button:disabled{opacity:.5;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.35);z-index:100;opacity:0;transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast.err{background:var(--danger);}

  .loading-row{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;padding:20px 2px;}
  .spinner{
    width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="badge-card">
    <div class="badge-header">
      <div class="badge-eyebrow"><span>Access Panel</span><span id="date-stamp"></span></div>
      <div class="badge-title">Work Order</div>
      <p class="badge-sub">Assign it. Track it. Close it out.</p>
      <div class="badge-punch"></div>
    </div>
    <div class="badge-body">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" type="button">Sign in</button>
        <button class="tab-btn" id="tab-signup" type="button">Create account</button>
      </div>

      <div id="auth-message"></div>

      <!-- login form -->
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button class="btn-primary" type="submit" id="login-submit">Sign in</button>
        <p class="auth-note"><a href="#" id="forgot-password-link">Forgot your password?</a></p>
        <p class="auth-note">First time here? Switch to <b>Create account</b> above.</p>
      </form>

      <!-- forgot password form -->
      <form id="forgot-form" class="hidden">
        <p class="auth-note" style="margin-top:0;">Enter your email and we'll send you a link to reset your password.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" required autocomplete="email">
        </div>
        <button class="btn-primary" type="submit" id="forgot-submit">Send reset link</button>
        <p class="auth-note"><a href="#" id="back-to-login-link">Back to sign in</a></p>
      </form>

      <!-- signup form -->
      <form id="signup-form" class="hidden">
        <div class="field">
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email">

<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwd2JjdXh3eGtxdmF1ZmZxb29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjA4NjEsImV4cCI6MjA5OTM5Njg2MX0.iAoIZXl-2G7h3wm4jcYsEs6-wdN-YKTS-KbBteBBzUk";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let currentUser = null;   // auth user
let myProfile = null;     // { id, email, full_name, role }
let profilesById = {};    // cache of all profiles
let allTasks = [];        // manager: all tasks. member: own tasks.
let activeTaskId = null;
let realtimeChannel = null;

const STATUS_LABELS = { todo:"To do", in_progress:"In progress", blocked:"Blocked", done:"Done" };
const STATUS_ORDER = ["todo","in_progress","blocked","done"];
const STATUS_DOT = { todo:"#9AA1B2", in_progress:"#3B6FA0", blocked:"#C1443D", done:"#2F8F5B" };

/* ===================== HELPERS ===================== */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
function initials(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{ month:"short", day:"numeric", year:"numeric" });
}
function fmtDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{ month:"short", day:"numeric" }) + " · " +
    dt.toLocaleTimeString(undefined,{ hour:"numeric", minute:"2-digit" });
}
function isOverdue(due, status){
  if(!due || status === "done") return false;
  return new Date(due) < new Date(new Date().toDateString());
}
function shortId(id){ return id ? id.slice(0,8) : ""; }
function showToast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove("show"), 2600);
}

$("#date-stamp").textContent = new Date().toLocaleDateString(undefined,{ month:"short", day:"2-digit", year:"numeric" });

/* ===================== AUTH TABS ===================== */
$("#tab-login").addEventListener("click", ()=>{
  $("#tab-login").classList.add("active"); $("#tab-signup").classList.remove("active");
  $("#login-form").classList.remove("hidden"); $("#signup-form").classList.add("hidden"); $("#forgot-form").classList.add("hidden");
  $("#auth-message").innerHTML = "";
});
$("#tab-signup").addEventListener("click", ()=>{
  $("#tab-signup").classList.add("active"); $("#tab-login").classList.remove("active");
  $("#signup-form").classList.remove("hidden"); $("#login-form").classList.add("hidden"); $("#forgot-form").classList.add("hidden");
  $("#auth-message").innerHTML = "";
});

/* ===================== FORGOT PASSWORD ===================== */
$("#forgot-password-link").addEventListener("click", (e)=>{
  e.preventDefault();
  $("#login-form").classList.add("hidden");
  $("#signup-form").classList.add("hidden");
  $("#forgot-form").classList.remove("hidden");
  $("#tab-login").classList.remove("active"); $("#tab-signup").classList.remove("active");
  $("#auth-message").innerHTML = "";
});
$("#back-to-login-link").addEventListener("click", (e)=>{
  e.preventDefault();
  $("#tab-login").click();
});
$("#forgot-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("#forgot-submit");
  btn.disabled = true; btn.textContent = "Sending…";
  $("#auth-message").innerHTML = "";
  let redirectTarget;
  try { redirectTarget = window.top.location.href.split("#")[0]; }
  catch(err) { redirectTarget = window.location.href.split("#")[0]; }
  const { error } = await db.auth.resetPasswordForEmail($("#forgot-email").value.trim(), {
    redirectTo: redirectTarget
  });
  btn.disabled = false; btn.textContent = "Send reset link";
  if(error){
    $("#auth-message").innerHTML = `<div class="auth-error">${error.message}</div>`;
    return;
  }
  $("#tab-login").click();
  $("#auth-message").innerHTML = `<div class="auth-success">If an account exists for that email, a reset link is on its way — check your inbox (and spam folder).</div>`;
});

/* ===================== AUTH ACTIONS ===================== */
$("#login-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("#login-submit");
  btn.disabled = true; btn.textContent = "Signing in…";
  $("#auth-message").innerHTML = "";
  const { error } = await db.auth.signInWithPassword({
    email: $("#login-email").value.trim(),
    password: $("#login-password").value
  });
  btn.disabled = false; btn.textContent = "Sign in";
  if(error){
    $("#auth-message").innerHTML = `<div class="auth-error">${error.message}</div>`;
  }
});

$("#signup-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("#signup-submit");
  btn.disabled = true; btn.textContent = "Creating account…";
  $("#auth-message").innerHTML = "";
  const role = $all('input[name="role"]').find(r=>r.checked).value;
  const { data, error } = await db.auth.signUp({
    email: $("#signup-email").value.trim(),
    password: $("#signup-password").value,
    options: { data: { full_name: $("#signup-name").value.trim(), role } }
  });
  btn.disabled = false; btn.textContent = "Create account";
  if(error){
    $("#auth-message").innerHTML = `<div class="auth-error">${error.message}</div>`;
    return;
  }
  if(data.session){
    // signed in immediately (email confirmation disabled)
  } else {
    $("#auth-message").innerHTML = `<div class="auth-success">Account created. Check your email to confirm it, then sign in.</div>`;
    $("#tab-login").click();
  }
});

$("#signout-btn").addEventListener("click", async ()=>{
  await db.auth.signOut();
});

/* ===================== SESSION / BOOT ===================== */
db.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    currentUser = session.user;
    boot();
  } else {
    currentUser = null; myProfile = null;
    if(realtimeChannel){ db.removeChannel(realtimeChannel); realtimeChannel = null; }
    $("#app-screen").classList.add("hidden");
    $("#auth-screen").classList.remove("hidden");
  }
});

async function boot(){
  $("#auth-screen").classList.add("hidden");
  $("#app-screen").classList.remove("hidden");

  const { data: profile, error } = await db.from("profiles").select("*").eq("id", currentUser.id).single();
  if(error || !profile){
    showToast("Couldn't load your profile.", true);
    return;
  }
  myProfile = profile;
  $("#who-name").textContent = myProfile.full_name;
  $("#who-role").textContent = myProfile.role === "manager" ? "Assigner" : "Team member";

  await loadAllProfiles();

  if(myProfile.role === "manager"){
    $("#manager-view").classList.remove("hidden");
    $("#member-view").classList.add("hidden");
    populateAssigneeOptions();
    await loadManagerTasks();
  } else {
    $("#member-view").classList.remove("hidden");
    $("#manager-view").classList.add("hidden");
    await loadMemberTasks();
  }

  subscribeRealtime();
}

async function loadAllProfiles(){
  const { data, error } = await db.from("profiles").select("id, full_name, email, role");
  if(!error && data){
    profilesById = {};
    data.forEach(p=> profilesById[p.id] = p);
  }
}

function populateAssigneeOptions(){
  const sel = $("#nt-assignee");
  const filterSel = $("#filter-assignee");
  sel.innerHTML = "";
  filterSel.innerHTML = '<option value="">All team members</option>';
  Object.values(profilesById)
    .filter(p=>p.id !== myProfile.id)
    .sort((a,b)=>a.full_name.localeCompare(b.full_name))
    .forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id; opt.textContent = `${p.full_name} (${p.role === "manager" ? "Assigner" : "Member"})`;
      sel.appendChild(opt);
      const opt2 = opt.cloneNode(true);
      filterSel.appendChild(opt2);
    });
}

/* ===================== REALTIME ===================== */
function subscribeRealtime(){
  if(realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel = db.channel("task-assigner-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"tasks" }, ()=>{
      if(myProfile.role === "manager") loadManagerTasks(); else loadMemberTasks();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"task_updates" }, (payload)=>{
      if(activeTaskId && payload.new && payload.new.task_id === activeTaskId){
        loadTaskUpdates(activeTaskId);
      }
    })
    .subscribe();
}

/* ===================== MANAGER: LOAD + RENDER BOARD ===================== */
async function loadManagerTasks(){
  $("#manager-loading").classList.remove("hidden");
  $("#board").classList.add("hidden");
  $("#manager-empty").classList.add("hidden");

  const { data, error } = await db.from("tasks")
    .select("*")
    .eq("assigned_by", myProfile.id)
    .order("created_at", { ascending:false });

  $("#manager-loading").classList.add("hidden");

  if(error){ showToast("Couldn't load tasks.", true); return; }
  allTasks = data || [];
  renderBoard();
}

function renderBoard(){
  const filterId = $("#filter-assignee").value;
  const filtered = filterId ? allTasks.filter(t=>t.assigned_to === filterId) : allTasks;

  if(allTasks.length === 0){
    $("#manager-empty").classList.remove("hidden");
    $("#board").classList.add("hidden");
    return;
  }
  $("#manager-empty").classList.add("hidden");
  $("#board").classList.remove("hidden");

  const board = $("#board");
  board.innerHTML = "";
  STATUS_ORDER.forEach(status=>{
    const col = document.createElement("div");
    col.className = "col";
    const items = filtered.filter(t=>t.status === status);
    col.innerHTML = `
      <div class="col-head">
        <h3><span class="col-dot" style="background:${STATUS_DOT[status]}"></span>${STATUS_LABELS[status]}</h3>
        <span class="col-count">${items.length}</span>
      </div>
      <div class="col-body"></div>
    `;
    const body = col.querySelector(".col-body");
    items.forEach(t=> body.appendChild(renderTicket(t)));
    board.appendChild(col);
  });
}

function renderTicket(t){
  const assignee = profilesById[t.assigned_to];
  const el = document.createElement("div");
  el.className = "ticket";
  el.addEventListener("click", ()=> openDetail(t.id));
  const overdue = isOverdue(t.due_date, t.status);
  el.innerHTML = `
    <div class="ticket-top">
      <span class="ticket-id">#${shortId(t.id)}</span>
      <span class="prio-tag prio-${t.priority}">${t.priority}</span>
    </div>
    <p class="ticket-title">${escapeHtml(t.title)}</p>
    <div class="ticket-meta">
      <span class="ticket-person">
        <span class="avatar">${initials(assignee ? assignee.full_name : "?")}</span>
        ${assignee ? escapeHtml(assignee.full_name) : "Unassigned"}
      </span>
      <span class="ticket-due ${overdue?'overdue':''}">${t.due_date ? fmtDate(t.due_date) : ""}</span>
    </div>
  `;
  return el;
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

$("#filter-assignee").addEventListener("change", renderBoard);

/* ===================== MEMBER: LOAD + RENDER LIST ===================== */
async function loadMemberTasks(){
  $("#member-loading").classList.remove("hidden");
  $("#task-list").classList.add("hidden");
  $("#member-empty").classList.add("hidden");

  const { data, error } = await db.from("tasks")
    .select("*")
    .eq("assigned_to", myProfile.id)
    .order("created_at", { ascending:false });

  $("#member-loading").classList.add("hidden");
  if(error){ showToast("Couldn't load tasks.", true); return; }
  allTasks = data || [];
  renderTaskList();
}

function renderTaskList(){
  const statusFilter = $("#member-filter-status").value;
  const filtered = statusFilter ? allTasks.filter(t=>t.status === statusFilter) : allTasks;

  if(allTasks.length === 0){
    $("#member-empty").classList.remove("hidden");
    $("#task-list").classList.add("hidden");
    return;
  }
  $("#member-empty").classList.add("hidden");
  $("#task-list").classList.remove("hidden");

  const list = $("#task-list");
  list.innerHTML = "";
  filtered.forEach(t=>{
    const assigner = profilesById[t.assigned_by];
    const overdue = isOverdue(t.due_date, t.status);
    const row = document.createElement("div");
    row.className = "list-row";
    row.addEventListener("click", ()=> openDetail(t.id));
    row.innerHTML = `
      <span class="stamp stamp-${t.status}">${STATUS_LABELS[t.status]}</span>
      <div class="list-row-main">
        <p class="ticket-title">${escapeHtml(t.title)}</p>
        <div class="list-row-sub">
          <span>From ${assigner ? escapeHtml(assigner.full_name) : "—"}</span>
          <span class="prio-tag prio-${t.priority}" style="margin:0;">${t.priority}</span>
          ${t.due_date ? `<span class="${overdue?'overdue':''}" style="font-family:var(--font-mono);">Due ${fmtDate(t.due_date)}</span>` : ""}
        </div>
      </div>
    `;
    list.appendChild(row);
  });
}

$("#member-filter-status").addEventListener("change", renderTaskList);

/* ===================== NEW TASK MODAL ===================== */
$("#new-task-btn").addEventListener("click", ()=>{
  $("#new-task-form").reset();
  $("#new-task-modal").classList.remove("hidden");
});
$("#close-new-task").addEventListener("click", ()=> $("#new-task-modal").classList.add("hidden"));
$("#new-task-modal").addEventListener("click", (e)=>{ if(e.target.id === "new-task-modal") $("#new-task-modal").classList.add("hidden"); });

$("#new-task-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("#nt-submit");
  btn.disabled = true; btn.textContent = "Assigning…";
  const payload = {
    title: $("#nt-title").value.trim(),
    description: $("#nt-desc").value.trim() || null,
    assigned_to: $("#nt-assignee").value,
    assigned_by: myProfile.id,
    priority: $("#nt-priority").value,
    due_date: $("#nt-due").value || null
  };
  const { error } = await db.from("tasks").insert(payload);
  btn.disabled = false; btn.textContent = "Assign task";
  if(error){
    showToast("Couldn't create task: " + error.message, true);
    return;
  }
  $("#new-task-modal").classList.add("hidden");
  showToast("Task assigned.");
  loadManagerTasks();
});

/* ===================== TASK DETAIL MODAL ===================== */
async function openDetail(taskId){
  activeTaskId = taskId;
  const t = allTasks.find(x=>x.id === taskId);
  if(!t) return;
  const assignee = profilesById[t.assigned_to];
  const assigner = profilesById[t.assigned_by];

  $("#dt-title").textContent = t.title;
  $("#dt-priority").textContent = t.priority;
  $("#dt-priority").className = `prio-tag prio-${t.priority}`;
  $("#dt-id").textContent = `#${shortId(t.id)}`;
  $("#dt-desc").textContent = t.description || "No description provided.";
  $("#dt-assignee").textContent = assignee ? assignee.full_name : "—";
  $("#dt-assigner").textContent = assigner ? assigner.full_name : "—";
  $("#dt-due").textContent = t.due_date ? fmtDate(t.due_date) : "No due date";
  $("#dt-created").textContent = fmtDate(t.created_at);

  const canEditStatus = myProfile.role === "manager" || t.assigned_to === myProfile.id;
  const statusRow = $("#dt-status-row");
  statusRow.innerHTML = "";
  STATUS_ORDER.forEach(s=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "status-btn" + (s === t.status ? " current" : "");
    b.textContent = STATUS_LABELS[s];
    b.disabled = !canEditStatus || s === t.status;
    b.addEventListener("click", ()=> changeStatus(t.id, s));
    statusRow.appendChild(b);
  });

  $("#dt-note").value = "";
  $("#detail-modal").classList.remove("hidden");
  await loadTaskUpdates(taskId);
}

$("#close-detail").addEventListener("click", ()=>{
  $("#detail-modal").classList.add("hidden");
  activeTaskId = null;
});
$("#detail-modal").addEventListener("click", (e)=>{
  if(e.target.id === "detail-modal"){ $("#detail-modal").classList.add("hidden"); activeTaskId = null; }
});

async function changeStatus(taskId, newStatus){
  const { error } = await db.from("tasks").update({ status: newStatus }).eq("id", taskId);
  if(error){ showToast("Couldn't update status: " + error.message, true); return; }
  await db.from("task_updates").insert({
    task_id: taskId, user_id: myProfile.id, status_change: newStatus
  });
  showToast("Status updated.");
  // refresh local + modal
  if(myProfile.role === "manager") await loadManagerTasks(); else await loadMemberTasks();
  const t = allTasks.find(x=>x.id === taskId);
  if(t) openDetail(taskId);
}

async function loadTaskUpdates(taskId){
  const wrap = $("#dt-updates");
  wrap.innerHTML = `<div class="loading-row"><span class="spinner"></span> Loading log…</div>`;
  const { data, error } = await db.from("task_updates")
    .select("*")
    .eq("task_id", taskId)
    .order("created_at", { ascending:false });
  if(error){ wrap.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">Couldn't load updates.</p>`; return; }
  if(!data || data.length === 0){
    wrap.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">No updates yet — be the first to post one.</p>`;
    return;
  }
  wrap.innerHTML = "";
  data.forEach(u=>{
    const author = profilesById[u.user_id];
    const item = document.createElement("div");
    item.className = "update-item";
    item.innerHTML = `
      <span class="avatar">${initials(author ? author.full_name : "?")}</span>
      <div class="update-content">
        <div class="u-head">
          <span class="u-name">${author ? escapeHtml(author.full_name) : "Someone"}</span>
          <span class="u-time">${fmtDateTime(u.created_at)}</span>
        </div>
        ${u.note ? `<div class="u-note">${escapeHtml(u.note)}</div>` : ""}
        ${u.status_change ? `<span class="u-status-chip">→ moved to ${STATUS_LABELS[u.status_change] || u.status_change}</span>` : ""}
      </div>
    `;
    wrap.appendChild(item);
  });
}

$("#dt-post-update").addEventListener("click", async ()=>{
  const note = $("#dt-note").value.trim();
  if(!note || !activeTaskId) return;
  const btn = $("#dt-post-update");
  btn.disabled = true;
  const { error } = await db.from("task_updates").insert({
    task_id: activeTaskId, user_id: myProfile.id, note
  });
  btn.disabled = false;
  if(error){ showToast("Couldn't post update: " + error.message, true); return; }
  $("#dt-note").value = "";
  loadTaskUpdates(activeTaskId);
});
